<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>课标统领的教材脉络图 · 导出版</title>
<style>
:root{
  --bd:#ded8cc;--bd2:#c9bea9;--txt:#1f211c;--muted:#6f6a5f;--bg:#f6f2ea;--card:#fffdf8;
  --accent:#2f5d50;--accent2:#b9653b;--kbbg:#eef4f1;--kbbd:#bcd3ca;--qubg:#fdf4e8;--qubd:#e6c9a3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6}
.wrap{max-width:1400px;margin:0 auto;padding:14px 16px 60px}

/* ---------- 顶栏 ---------- */
.top{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 15px;
  position:sticky;top:6px;z-index:30;box-shadow:0 10px 26px rgba(55,48,35,.07)}
.t1{font-size:19px;font-weight:800}
.t2{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.65}
.t2:empty{display:none}
.tools{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--bd);background:#fff;color:var(--txt);font:inherit;font-size:13px;
  padding:6px 12px;border-radius:999px;cursor:pointer;line-height:1.3;transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.p:hover{background:#24473d;color:#fff}
.spacer{flex:1 1 auto}

/* ---------- 要素页的相关阅读方法 ---------- */
.strategy-related{margin:12px 2px}
.strategy-panel{margin-top:8px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:11px}
.strategy-support{margin:0 0 10px;color:var(--accent)}
.same-unit-relations{margin:12px 2px}
.same-unit-rel-panel{margin-top:8px;padding:10px 12px;background:#fbfaf5;border:1px solid var(--bd);border-radius:11px}
.same-unit-rel-note{margin:0 0 8px;color:var(--muted);font-size:12px}
.same-unit-rel-card{padding:9px 0;border-top:1px solid var(--ln)}
.same-unit-rel-card:first-of-type{border-top:0;padding-top:2px}
.same-unit-rel-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.same-unit-rel-link{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;cursor:pointer;font:inherit}
.same-unit-rel-element{margin:5px 0 3px;font-weight:600}
.same-unit-rel-summary{margin:0;color:var(--txt);line-height:1.55}
.same-unit-rel-source{margin-top:6px}
.same-unit-rel-source .details-body{font-size:12px;color:var(--muted)}
.strategy-table{width:100%;border-collapse:collapse;text-align:left;line-height:1.7}
.strategy-table th,.strategy-table td{padding:12px;border-bottom:1px solid var(--bd);vertical-align:top;overflow-wrap:anywhere}
.strategy-table thead th{background:var(--kbbg);font-size:13px;color:var(--accent)}
.strategy-table thead th:first-child{width:19%}
.strategy-table thead th:nth-child(2){width:22%}
.strategy-table thead th:nth-child(3){width:30%}
.strategy-table thead th:nth-child(4){width:29%}
.strategy-table thead span{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.strategy-table tbody th{font-weight:400}
.strategy-table tbody th b{display:block;color:var(--accent);font-size:15px}
.strategy-current{background:var(--kbbg)}
.strategy-current-unit{display:block;font-size:12px;color:var(--muted);padding-top:4px}
.strategy-unit{display:block;border:0;background:none;padding:4px 0;text-align:left;font:inherit;font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline}
.strategy-unit:hover{color:var(--accent2)}
.strategy-unit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strategy-sources{margin-top:16px}
.strategy-source-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.strategy-source-grid article{padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--card)}
.strategy-source-grid h3{margin:0;font-size:13px;color:var(--accent)}
.strategy-source-grid p{margin:5px 0}
.strategy-original{color:var(--txt);font-weight:600}
@media(max-width:700px){
  .strategy-panel,.same-unit-rel-panel{padding:12px}
  .strategy-table thead{display:none}
  .strategy-table,.strategy-table tbody,.strategy-table tr,.strategy-table tbody th,.strategy-table td{display:block;width:100%}
  .strategy-table tr{margin-bottom:12px;border:1px solid var(--bd);border-radius:9px;padding:4px}
  .strategy-table th,.strategy-table td{border-bottom:0;padding:7px 9px}
  .strategy-table td::before{content:attr(data-label);display:block;font-size:11px;color:var(--muted)}
  .strategy-source-grid{grid-template-columns:1fr}
}

/* ---------- 第一层：全表 ---------- */
.volhead{display:flex;align-items:baseline;gap:10px;margin:20px 2px 9px;flex-wrap:wrap;
  padding-bottom:6px;border-bottom:2px solid var(--bd2)}
.volhead b{font-size:16px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:11px}
.unit{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.unit h4{margin:0 0 3px;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.unit h4 span{font-size:11px;color:var(--muted);font-weight:400}
.unit .theme{font-size:12px;color:var(--accent2);margin-bottom:7px;line-height:1.5;font-weight:500}
.el{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:#fff;
  border-radius:9px;padding:7px 9px;margin-bottom:6px;font:inherit;font-size:13px;cursor:pointer;
  line-height:1.55;position:relative;padding-left:30px;transition:all .15s}
.el:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(47,93,80,.10)}
.el .no{position:absolute;left:8px;top:7px;width:15px;height:15px;border-radius:50%;
  background:var(--bd2);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.el.linked .no{background:var(--accent)}
.el .badge{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:4px;margin-left:5px;
  border:1px solid var(--bd2);background:#fff;color:var(--muted);vertical-align:1px}
.el.linked .badge{background:var(--kbbg);color:var(--accent);border-color:var(--kbbd)}
.el .badge.todo{background:var(--qubg);color:var(--accent2);border-color:var(--qubd)}

/* ---------- 第二层：脉络图 ---------- */
#detail{display:none}
.crumb{font-size:13px;color:var(--muted);margin:14px 2px 10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.crumb button#back{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;
  text-decoration:underline;padding:0;font-weight:500}

/* 导出下拉菜单 */
.exp-menu-wrap{position:relative}
.exp-dropdown{position:absolute;right:0;top:calc(100% + 4px);z-index:50;
  background:#fff;border:1px solid var(--bd2);border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.12);padding:6px;min-width:240px;display:none}
.exp-dropdown.show{display:block}
.exp-item{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:transparent;
  cursor:pointer;border-radius:6px;font:inherit;font-size:13px;color:var(--txt);line-height:1.4}
.exp-item:hover{background:var(--kbbg);color:var(--accent)}
.exp-hint{font-size:11px;color:var(--muted);padding:6px 12px 2px;border-top:1px solid var(--bd);margin-top:4px;line-height:1.4}

/* 课标依据区 */
.kbzone{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px 14px;margin-bottom:12px}
.kbzone h3{margin:0 0 8px;font-size:14px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kbcol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.kbcol{grid-template-columns:1fr}}
.kb-section-desc{font-size:11.5px;color:var(--muted);margin-bottom:6px}

.kbitem{border:1px solid var(--kbbd);background:var(--kbbg);border-radius:10px;padding:10px 12px;
  font-size:13px;line-height:1.6;margin-bottom:8px}
.kbitem .ref{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kbitem .short{color:var(--txt);font-size:13px;margin:4px 0;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.kbitem .short-text{min-width:0}
.point-badge{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;
  background:rgba(47,93,80,.12);color:var(--accent);margin-right:6px;border:1px solid rgba(47,93,80,.2);font-weight:normal}
.lbl{font-size:10.5px;color:var(--accent2);border:1px solid var(--qubd);background:var(--qubg);
  border-radius:4px;padding:0 5px}
.lbl.src{background:var(--kbbg);color:var(--accent);border-color:var(--kbbd)}
.lbl.jd{background:var(--qubg);color:var(--accent2);border-color:var(--qubd)}

/* 原生 details / summary 折叠依据 */
.kb-details{margin-top:6px}
.kbitem .kb-details{margin-top:0;flex:0 0 auto}
.kbitem .kb-details[open]{flex:1 0 100%}
.details-summary,.details-toggle{display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;
  color:var(--accent);font-weight:500;padding:2px 8px;border-radius:4px;
  background:rgba(47,93,80,.06);border:1px solid rgba(47,93,80,.18);user-select:none;outline:none;
  list-style:none}
.details-toggle{font-family:inherit;line-height:inherit}
.details-summary::-webkit-details-marker{display:none}
.details-summary:hover,.details-toggle:hover{background:rgba(47,93,80,.12);border-color:var(--accent)}
.details-summary::after,.details-toggle::after{content:" ▸";font-size:11px}
details[open] > .details-summary::after{content:" ▾"}
.details-toggle[aria-expanded="true"]::after{content:" ▾"}
details[open] > .details-summary,.details-toggle[aria-expanded="true"]{background:rgba(47,93,80,.12);border-color:var(--accent)}
.details-summary:focus-visible,.details-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.details-body{margin-top:6px;padding:8px 10px;border-radius:6px;background:#faf8f3;
  border:1px dashed var(--bd2);font-size:12px;line-height:1.6;color:var(--muted)}
.details-body .row{margin-bottom:4px}
.details-body .row:last-child{margin-bottom:0}
.details-body .k{color:var(--muted);font-size:11.5px}

/* 路径按钮与说明 */
.pathtabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 2px 10px;align-items:center}

/* 三栏脉络主板 */
.board{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:12px;align-items:start}
.side{display:flex;flex-direction:column;gap:9px}
.sideh{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;padding:0 4px;
  display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.side-count{font-size:11px;font-weight:normal;color:var(--muted)}

/* 侧边节点卡片 */
.node{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:10px 12px;
  font-size:13px;line-height:1.55}
.node:hover{border-color:var(--bd2)}
.node .nh{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.node .nh b{font-size:13px;color:var(--accent)}
.node-text{font-size:14px;font-weight:600;color:var(--txt);line-height:1.55;margin:4px 0 6px;word-break:break-word}
.node-link{font-size:12.5px;color:#4a4439;line-height:1.5;margin-bottom:6px}
.link-label{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:3px;
  background:var(--qubg);color:var(--accent2);border:1px solid var(--qubd);margin-right:5px}

.more{border:1px dashed var(--bd2);background:#fff;color:var(--muted);font:inherit;font-size:12px;
  padding:7px;border-radius:9px;cursor:pointer;width:100%;transition:all .15s}
.more:hover{border-color:var(--accent);color:var(--accent)}

/* 当前中心要素卡片 */
.center{background:linear-gradient(180deg,#fffdf8,#f3f8f5);border:2px solid var(--accent);
  border-radius:14px;padding:14px 16px}
.center .ch{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.center .ch b{font-size:13px;color:var(--accent)}
.center .ct{font-size:18px;line-height:1.65;font-weight:700;color:#182c25;margin:6px 0 8px;word-break:break-word}
.center .cnote{font-size:13px;color:#37423d;margin-bottom:8px;line-height:1.55;padding:6px 9px;
  background:#edf4f0;border-radius:6px;border:1px solid #d2e4dc}
.center .cm{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.theme-tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;
  background:var(--qubg);color:var(--accent2);border:1px solid var(--qubd)}
.theme-open-btn{border:1px solid var(--qubd);border-radius:5px;background:#fffaf2;color:#8d4d2d;
  font:inherit;font-size:12px;padding:3px 8px;cursor:pointer}
.theme-open-btn:hover{border-color:var(--accent2);background:var(--qubg)}
.theme-panel{margin:14px 2px;padding:14px 16px;background:#fffdf8;border:1px solid var(--bd);border-radius:13px}
.theme-panel-heading{font-size:16px;font-weight:750;color:var(--accent);margin-bottom:10px}
.theme-panel-heading span{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.theme-caution{margin:9px 0;font-size:12px;line-height:1.6;color:var(--muted)}
.theme-panel h4{margin:12px 0 7px;font-size:13px;color:var(--txt)}
.theme-candidate{padding:11px 12px;background:#fff;border:1px solid var(--bd);border-radius:10px}
.theme-candidate.is-current{border-color:var(--accent2);background:#f7f3ea}
.theme-candidate-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.theme-candidate-head b{color:var(--accent)}
.theme-candidate-head span{font-size:11px;color:var(--muted)}
.theme-candidate blockquote{margin:7px 0;padding-left:10px;border-left:3px solid var(--accent2);font-size:15px;font-weight:650}
.theme-candidate blockquote span{display:block;margin-bottom:3px;font-size:10px;font-weight:400;color:var(--muted)}
.theme-reason{margin:7px 0;font-size:13px;line-height:1.65}
.theme-source,.theme-elements{margin-top:7px}
.theme-source>div{margin-top:6px;padding:8px 10px;background:#faf8f3;border:1px dashed var(--bd2);border-radius:6px;
  font-size:12px;line-height:1.6;color:var(--muted)}
.theme-source a{color:var(--accent);font-weight:600}
.theme-element{display:flex;align-items:flex-start;gap:8px;width:100%;margin-top:6px;padding:8px 10px;text-align:left;
  border:1px solid var(--bd);border-radius:7px;background:#fff;font:inherit;cursor:pointer;line-height:1.5}
.theme-element:hover{border-color:var(--accent);background:var(--kbbg)}
.theme-element-kind{flex:0 0 auto;padding:0 5px;border-radius:4px;background:var(--qubg);color:#8d4d2d;font-size:11px}
.theme-element-action{margin-left:auto;flex:0 0 auto;color:var(--accent);font-size:11px}
.source-tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;
  background:#eef4f1;color:var(--accent);border:1px solid var(--kbbd)}
.lbl2{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:4px;
  border:1px solid var(--bd2);background:#fff;color:var(--muted)}
.lbl2.src{background:var(--kbbg);color:var(--accent);border-color:var(--kbbd)}
.lbl2.jd{background:var(--qubg);color:var(--accent2);border-color:var(--qubd)}
.lbl2.todo{background:#fff;color:var(--accent2);border-color:var(--qubd)}

/* 同单元相关要素 */
.same-unit-box{background:#fffcf5;border:1px dashed var(--qubd);border-radius:9px;padding:9px 11px;
  margin-bottom:9px;font-size:12.5px;line-height:1.55}
.same-unit-title{font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:5px}
.su-item{margin:3px 0}
.su-note{font-size:11px;color:var(--accent2)}

/* 底部说明与图例 */
.legend{font-size:12px;color:var(--muted);margin:12px 2px;line-height:1.7;padding:8px 12px;
  background:rgba(0,0,0,.02);border-radius:8px;border:1px solid var(--bd)}
.empty{background:var(--card);border:1px dashed var(--bd2);border-radius:11px;padding:14px;
  font-size:13px;color:var(--muted);line-height:1.7}
.focus-relations{margin:12px 2px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:13px}
.focus-heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.focus-heading h3{margin:0;color:var(--accent);font-size:16px}
.focus-heading span,.focus-prior h4 span,.focus-edition h4 span{font-size:11px;font-weight:400;color:var(--muted)}
.focus-boundary{margin:6px 0 12px;color:var(--muted);font-size:12px;line-height:1.6}
.focus-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.9fr) minmax(0,.8fr);gap:12px;align-items:start}
.focus-prior,.focus-edition{display:flex;flex-direction:column;gap:8px;min-width:0}
.focus-prior h4,.focus-edition h4{margin:0 0 2px;color:var(--accent);font-size:13px}
.focus-current{min-width:0}
.focus-small-note{margin:0;font-size:11px;color:var(--muted)}
.focus-fold{margin-top:10px;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:#fbfaf6}
.focus-fold>.details-summary{font-size:12px}
.focus-fold>.node,.focus-fold>.board{margin-top:9px}
.focus-index[open]{padding-bottom:12px}
.focus-index .board{margin-top:10px}
.wide-path-index{margin:10px 2px;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:11px}
.wide-index-note{margin:0 0 7px;color:var(--muted);font-size:12px;line-height:1.55}
.wide-current-note{margin-bottom:8px}
.wide-index-details{padding-top:2px}
.wide-index-board{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.wide-index-board .side{min-width:0}
.foot{font-size:11.5px;color:var(--muted);margin-top:26px;line-height:1.8;
  border-top:1px solid var(--bd);padding-top:12px}
.foot-meta{display:grid;gap:2px;margin-bottom:6px}
.foot-details>summary{cursor:pointer;color:var(--muted);font-weight:600}
.foot-notes{margin-top:6px;padding:8px 11px;background:#fffdf8;border:1px solid var(--bd);border-radius:8px}
.foot-notes p{margin:4px 0}

/* 宽窄屏单张当前卡片控制 */
.center-mobile{display:none !important}
.center-desktop{display:block !important}

@media(max-width:900px){
  .focus-grid{grid-template-columns:1fr}
  .wide-index-board{grid-template-columns:1fr}
  #detail{display:flex;flex-direction:column}
  #detail .crumb{order:1}
  #detail .center-mobile{display:block !important;order:2;margin-bottom:12px;box-shadow:0 4px 14px rgba(47,93,80,.12)}
  #detail .center-desktop{display:none !important}
  #detail .pathtabs{order:3}
  #detail .kbzone{order:4;margin-bottom:12px}
  #detail .board{order:5;display:flex;flex-direction:column;gap:12px}
  #detail .board .side.pre-side{order:1}
  #detail .board .side.post-side{order:2}
  #detail .legend{order:7}
  #detail .strategy-related{order:6}
  .theme-element{flex-wrap:wrap}
  .theme-element-action{margin-left:0}
}

/* ---------- 专用打印样式 (@media print) ---------- */
#print-view{display:none}

@media print {
  @page {
    size: A4 landscape;
    margin: 10mm 12mm;
  }
  html, body {
    background: #fff !important;
    color: #111 !important;
    font-size: 10pt !important;
    line-height: 1.5 !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  body > *:not(#print-view) {
    display: none !important;
  }
  #print-view {
    display: block !important;
    width: 100% !important;
  }
  .print-page {
    page-break-after: always;
    break-after: page;
    box-sizing: border-box;
    padding-bottom: 5mm;
  }
  .appendix-page {
    page-break-before: always;
    break-before: page;
    box-sizing: border-box;
    padding-top: 5mm;
  }
  .avoid-break {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  
  /* 打印专用概览排版 */

业质量 → (二)学业质量描述 → 第三学段","printPage":"40～41","pdfPage":"43～44","text":"独立阅读散文、小说、诗歌等文学作品，在阅读过程中能获取主要内容，用朗读、复述等自己擅长的方式呈现对作品内容的理解；能用文字、结构图等方式梳理作品的行文思路；能品味作品中重要的语句和富有表现力的语言，注意词语的感情色彩，通过圈点、批注等多种方法记录自己的阅读感受和体验，并主动与他人分享；能通过诵读、改写、表演等方式，表达自己对感人情境和形象的理解与审美体验；能借助与文本相关的材料，结合作品关键语句评价文本中的主要事件和人物，提出自己的观点或看法；能发现不同类型文本的结构方式和语言特点，感受作品内容、表现形式上的不同，积极向他人推荐，并有条理地说明推荐理由。在文学体验活动中涵养健康向上的审美情趣。","short":"阅读文学作品，获取主要内容，品味语言，表达对情境形象的理解与审美体验","scope":"文学作品阅读与鉴赏"},{"xueduan":"第三学段","chapter":"五、学业质量 → (二)学业质量描述 → 第三学段","printPage":"41","pdfPage":"44","text":"能借助与文本相关的材料，结合作品关键语句评价文本中的主要事件和人物，提出自己的观点或看法；能发现不同类型文本的结构方式和语言特点，感受作品内容、表现形式上的不同，积极向他人推荐，并有条理地说明推荐理由。","short":"借助与文本相关的材料，结合关键语句评价主要事件和人物","scope":"文学阅读·借助材料评价"}],"nodes":[{"eid":"二上-七-1","uid":"二上-七","link":"想象指向初步的情感体验；课标第一学段目标有相同表述，保留“初步”，不从教材顺序推出稳定进阶。","key":false,"verified":true},{"eid":"二下-二-1","uid":"二下-二","link":"把想象落到句子、建构画面；教参明确回指二上七。此为教参说明的学习安排联系，不证明前项已掌握或构成等级。","key":false,"verified":true},{"eid":"二下-四-1","uid":"二下-四","link":"用想象理解童话内容；教参列举二上七与二下二为此前安排。这里对应想象体验，不把“理解内容”并入情感目标，也不推成递进。","key":false,"verified":true},{"eid":"三上-四-1","uid":"三上-四","link":"本单元把阅读童话落在丰富想象与真善美体验上，核心对象是文学作品中的形象、情感和价值体验，归入本线有课标目标支持；教参未将它明确连到某个前项，教材先后只表示位置，不表示递进。","key":false,"verified":true},{"eid":"四上-四-1","uid":"四上-四","link":"要素后半单独要求感受神话鲜明人物形象，归入形象与情感理解。教参印刷页97/PDF111说明此前读过神话人物、本单元继续在把握内容基础上关注人物形象；没有点名具体前序单元ID，故不补具体先行节点，也不把“感受”扩大成评价人物。","key":false,"verified":true},{"eid":"四下-一-1","uid":"四下-一","link":"本单元阅读要素“抓住关键词句，初步体会课文表达的思想感情”：教参印刷p1/PDF15说明这一阅读体验为同单元写喜爱地方、表达感受提供范例；印刷p106/PDF120又明确四下四在本要素基础上进一步关注作家如何表达感情。前者是读写配合，后者是教参明示的教学要求联系；均不证明学生已经掌握。","key":true,"verified":true},{"eid":"四下-三-1","uid":"四下-三","link":"教参印刷页67/PDF81把本单元定位为现代诗学习，要求初步了解特点并通过朗读体会诗歌情感；同时提醒避免过度解读、成人化或学术化分析。归入形象与情感理解只承接诗歌情感体验；文体特点认知保留“初步”边界，不扩成格律、修辞或深度词句分析。","key":false,"verified":true},{"eid":"四下-四-1","uid":"四下-四","link":"教参印刷页106/PDF120明确说明，本要素在第一单元“初步体会课文表达的思想感情”基础上，进一步要求不仅体会文章感情，还关注作家如何表达。这是明确的教参教学安排联系，不证明学生已掌握第一单元内容或能力必然递进。","key":false,"verified":true},{"eid":"四下-七-1","uid":"四下-七","link":"体会对象改为人物品质，抓手是人物描写。","key":false,"verified":false},{"eid":"四下-八-1","uid":"四下-八","link":"本要素要求感受童话想象的奇妙并体会人物真善美形象，归入形象与情感理解。教参印刷p217/PDF231比较三年级上册的童话学习时写“第三单元”，但教材原页中相同要素实际在三上第四单元，第三单元是预测；故保留来源矛盾，不建立三上具体前驱。教参同时说明本单元阅读与新编故事习作相互配合，具体写作端见四下-八-2；不把阅读体验当成写作达成。","key":false,"verified":true},{"eid":"五上-一-1","uid":"五上-一","link":"抓手是具体事物，仍写明“初步”。教参印刷p1/PDF16明确说本单元阅读与习作共同指向借助具体事物表达情感；阅读端是体会作者表达，五上-一-2是书面表达个人感情，二者目标相关但表现任务不同，不证明读中体会自动迁移为写作达成。","key":true,"verified":true},{"eid":"五上-四-1","uid":"五上-四","link":"本单元明确要求结合资料体会思想感情，程度用“深入”。","key":true,"verified":true},{"eid":"五上-六-1","uid":"五上-六","link":"抓手是细节描写，情感见于细处。 教参印刷p163/PDF178明示阅读中的细节体会为五上-六-2习作表达看法和感受提供迁移方法；不据此认定迁移已发生。","key":true,"verified":true},{"eid":"五下-一-1","uid":"五下-一","link":"不再写明抓手，直接要求体会思想感情。 教参印刷p1/PDF17称本单元阅读与习作体现读写结合；习作端五下-一-2将童年往事重点部分写具体，体会课文情感不替代写作表现。","key":false,"verified":false},{"eid":"五下-四-1","uid":"五下-四","link":"对象是人物内心，抓手是动作、语言、神态描写。 教参印刷p80/PDF96明确把阅读中体会人物内心的方法用于五下-四-2习作“他___了”；这是读写方法迁移安排，不等同学生已能写出人物内心。","key":false,"verified":false},{"eid":"五下-五-1","uid":"五下-五","link":"【阅读学习】本单元精读课文《人物描写一组》等学习描写人物的基本方法，感受人物形象特点。","key":false,"verified":false},{"eid":"六上-四-1","uid":"六上-四","link":"对象是小说人物形象，借助情节与环境。","key":false,"verified":false},{"eid":"六下-三-1","uid":"六下-三","link":"对象是文章怎样表达情感，落点在表达方式。 六下教师用书印刷p77/PDF91指出，两篇精读课文和交流平台围绕表达真实情感展开，并作为习作准备；这是教学设计中的跨路径读写联系，阅读理解不替代写作表现。","key":true,"verified":true},{"eid":"六下-四-1","uid":"六下-四","link":"对象回到人物品质，抓手是外貌、神态、言行描写。","key":false,"verified":false}],"crossDomain":[],"verifiedUnits":["四下-一","四下-三","五上-一","五上-四","五上-六","五上-八","六上-八","六下-三"]},"资料运用":{"domain":"梳理与探究","kbiao":[["第一学段","梳理与探究",3],["第二学段","梳理与探究",3],["第三学段","梳理与探究",3]],"summary":"围绕问题搜集资料 → 整理方法 → 用于理解 → 用于表达与探究。","note":"这条线跨“梳理与探究”和“阅读与鉴赏”两个领域，不是一根没有分叉的长箭头。","quality":[{"xueduan":"第三学段","chapter":"五、学业质量 → (二)学业质量描述 → 第三学段","printPage":"41","pdfPage":"44","text":"能借助与文本相关的材料，结合作品关键语句评价文本中的主要事件和人物，提出自己的观点或看法；能发现不同类型文本的结构方式和语言特点，感受作品内容、表现形式上的不同，积极向他人推荐，并有条理地说明推荐理由。","short":"借助与文本相关的材料，结合关键语句评价主要事件和人物","scope":"文学阅读·借助材料评价"},{"xueduan":"第三学段","chapter":"五、学业质量 → (二)学业质量描述 → 第三学段","printPage":"40","pdfPage":"43","text":"能概括说明性文字的主要内容或简单的非连续性文本的关键信息，初步判断内容或信息的合理性；能用准确的语言清楚地介绍、说明事物或程序，运用文本主要信息解决现实生活中的简单问题。","short":"概括说明性文字关键信息，清楚介绍、说明事物或程序","scope":"说明性表达与介绍事物"},{"xueduan":"第三学段","chapter":"五、学业质量 → (二)学业质量描述 → 第三学段","printPage":"41","pdfPage":"44","text":"积极参加跨学科学习活动，能利用多种信息渠道获取资料，在简单的调查、访谈等活动中记录真实生活；能根据活动需要，结合自己的知识积累和生活经验提出要探究、解决的主要问题；能借助跨学科知识和相关材料，与同学合作探索解决问题的具体方法，运用相关知识解释自己的想法，记录探究的过程及结论，写简单的研究报告；能组织讨论和专题演讲，发表自己的观点，在交流反思中辨别是非、善恶和美丑。","short":"利用多渠道获取资料，合作探索解决问题，写简单的研究报告","scope":"跨学科活动·获取资料与研究报告"},{"xueduan":"第三学段","chapter":"五、学业质量 → (二)学业质量描述 → 第三学段","printPage":"41","pdfPage":"44","text":"能根据校园、社会活动的需要，自己或与同学合作撰写活动计划、实施方案或活动总结。","short":"根据活动需要撰写活动计划、实施方案或活动总结","scope":"综合实践·活动方案与总结"}],"nodes":[{"eid":"三下-四-2","uid":"三下-四","link":"围绕节日主题收集资料；同单元另有写过节情景的要求。","key":false,"verified":false},{"eid":"三下-七-2","uid":"三下-七","link":"信息整合之后用于介绍一种事物。","key":false,"verified":false},{"eid":"四上-六-2","uid":"四上-六","link":"为明确的介绍对象收集、整理资料。","key":false,"verified":false},{"eid":"四下-三-2","uid":"四下-三","link":"写明“根据需要”，收集是有选择的；同时要求初步学习整理方法。","key":true,"verified":true},{"eid":"四下-三-3","uid":"四下-三","link":"成果呈现环节，资料整理落到可展示的作品上。","key":false,"verified":true},{"eid":"五上-四-1","uid":"五上-四","link":"本单元明确要求结合资料体会思想感情。 用户提出的同一条件假设：资料量大时，五上二提速阅读可能支持本单元资料初读与筛选理解；效果待课堂观察，非教材/课标明示，不作普遍先修。","key":true,"verified":true},{"eid":"五上-五-2","uid":"五上-五","link":"资料用于说明性表达，与说明方法结合。 教参印刷p131/PDF146明示五上-五-1阅读学习说明方法与本习作“从学到用”的联系；资料搜集与说明表达分属不同任务。","key":false,"verified":false},{"eid":"五下-三-2","uid":"五下-三","link":"方法被单独提出：学习搜集资料的基本方法。","key":false,"verified":false},{"eid":"五下-三-3","uid":"五下-三","link":"成果形式为研究报告，与前面的收集、整理形成一组要求。","key":false,"verified":false},{"eid":"五下-七-2","uid":"五下-七","link":"教参说明本单元按目的搜集、整理资料并清楚介绍事物，教材的“介绍一个地方”把资料运用作为明确任务；不因有“介绍”二字而把资料目标并成一般表达组织。","key":false,"verified":true},{"eid":"六上-八-1","uid":"六上-八","link":"资料用于理解课文主要内容，写明“借助相关”。","key":true,"verified":true},{"eid":"六下-四-2","uid" 本单元想象故事写作打基础；p213/PDF225明示本册第八单元在本单元想象故事写作基础上继续编写童话。两处都是教参说明的教材安排，不证明学生已掌握、两个习作要求完全同类或质量递进。","key":false,"verified":true},{"eid":"三下-六-2","uid":"三下-六","link":"教参回顾二下写话“我的好朋友”和三上“猜猜他是谁”作为此前写人练习，并说明本单元转向抓人物特点、用事例表现特点。四上第二单元教参又将“身边那些有特点的人”与“我的家人”列为第三次写人习作。四下第七单元教参印刷p190/PDF204引用三年级下册“写一个身边的人，尝试写出他的特点”，与本要素原句唯一匹配，因此补记四下-七-2的后续任务联系。以上均是教参描述的教学安排，不证明学生已掌握或学业质量必然提升。","key":false,"verified":true},{"eid":"三下-八-2","uid":"三下-八","link":"教参明确本单元根据提示编写童话是在三下第五单元“奇妙的想象”习作基础上的继续练习。这是教参写明的教材教学安排，不证明学生已掌握、两项完全同类、形成质量进阶或构成必然先修。","key":false,"verified":true},{"eid":"四上-一-2","uid":"四上-一","link":"推荐一个地点并写清理由，是面向他人的推荐表达；教参强调介绍自己喜欢的地方、清楚充分说明理由。归入表达组织体现书面理由组织，不扩写成完整论证结构或说服能力达成标准。","key":false,"verified":true},{"eid":"四上-二-2","uid":"四上-二","link":"四上第二单元教参印刷页31/PDF45把“猜猜他是谁”→“身边那些有特点的人”→本单元“我的家人”列为本套教材第三次写人习作，说明要求逐步提升；“身边那些有特点的人”与三下第六单元要素“写一个身边的人，尝试写出这个人的特点”相对应。本图记录教参所述的任务安排，不证明学生已掌握或能力等级必然提升；这里是写作选材与表达，不是阅读人物形象。","key":false,"verified":true},{"eid":"四上-四-2","uid":"四上-四","link":"本要素要求展开想象写故事，归入表达组织。教参印刷页97/PDF111提到三年级习作安排过创编童话、发挥想象写故事，并说明本单元围绕熟悉的神话或童话人物继续创作；教参没有点名单元ID，因此不把它硬连到三下第五或第八单元的具体节点，也不据此认定掌握或质量进阶。","key":false,"verified":true},{"eid":"四上-五-1","uid":"四上-五","link":"本要素是阅读中了解作者怎样把一件事写清楚，学习焦点是叙事组织方法；同单元另有习作“写一件事，把事情写清楚”，二者构成读写配对，但阅读分析不等于学生已经能独立写清楚。归入表达组织只表示学习如何组织叙事信息。教参印刷页127/PDF141未指明与其他单元要素的具体连线。","key":false,"verified":true},{"eid":"四上-五-2","uid":"四上-五","link":"教参印刷页127/PDF141将第五单元习作概括为“写一件事，把事情写清楚”；印刷页181/PDF195明确说第七单元在此基础上增加按起因、经过、结果写事及呈现各阶段心情变化。这是教材教学安排联系，不证明学生已掌握前项或质量等级递进。","key":false,"verified":false},{"eid":"四上-七-2","uid":"四上-七","link":"教参印刷页127/PDF141将第五单元习作目标概括为“写一件事，把事情写清楚”；印刷页181/PDF195明确说明第七单元建立在该习作基础上，增加写出事情起因、经过、结果及各阶段心情变化。这是教参明示的教材安排联系，不表示学生已掌握前项或已经达到更高质量等级；写出自己的感受是写作内容，不等同于阅读人物情感。","key":false,"verified":true},{"eid":"四下-一-2","uid":"四下-一","link":"教师用书印刷页1/PDF15明确说明，阅读中抓关键语句、初步体会思想感情，为写喜爱的地方并表达自己的感受提供范例。这是同单元读写支持；读懂情感不等于已经会写出自己的感受。 五上教参印刷p194/PDF209将其与五上-七-2“写出景物特点”比较：四下此项偏整体感受，五上聚焦景物特征；是教学比较，不是先修门槛。","key":false,"verified":true},{"eid":"四下-二-2","uid":"四下-二","link":"本要素要求围绕想发明的事物展开奇思妙想并用文字写出想法，归入表达组织。教参印刷页32/PDF46说明文字描述想法可激发想象与创造；它不是故事续写，也未规定说明文结构。","key":false,"verified":true},{"eid":"四下-四-2","uid":"四下-四","link":"同单元写作要素改为写自己喜欢的动物、试着写出特点；阅读要素关注作家如何表达对动物的感情。题材相近但学习任务不同，不能以阅读体会替代写作表现，也不据此推出阅读为习作的必然先修。","key":false,"verified":true},{"eid":"四下-五-1","uid":"四下-五","link":"本要素要求读中了解课文按一定顺序写景物的方法；教参印刷p136/PDF150又明确把它与同单元习作四下-五-2“学习按游览的顺序写景物”配合，作为阅读范例支持习作实践。两项关系现已双端登记；不等于学生已能独立写景。教参对三、四年级经验未点具体单元，不补具体前序ID。","key":false,"verified":true},{"eid":"四下-五-2","uid":"四下-五","link":"本要素要求学习按游览顺序写景物，与四下-五-1“了解课文按一定顺序写景物的方法”构成同单元阅读与习作配合。教参印刷p136/PDF150明确把阅读中学习写景顺序作为习作实践准备；这是教材任务安排，不证明学生已经掌握写景方法或完成习作。 五上教参印刷p194/PDF209还比较五上-七-2。教参对四下五的概述“初步写出景物特点”与所给教材原句“学习按游览的顺序写景物”焦点不同，保留为教学比较，不改教材原句或认作线性进阶。","key":false,"verified":true},{"eid":"四下-六-2","uid":"四下-六","link":"增加“按一定顺序”这一组织手段。","key":true,"verified":false},{"eid":"四下-七-2","uid":"四下-七","link":"教参印刷p190/PDF204回顾三年级下册写“一个身边的人，尝试写出他的特点”的练习，并说本单元进一步学习从多个方面写人物特点。该原句与教材要素三下-六-2唯一匹配，故记录为教参明示的教学任务联系；教参未写单元编号，此处对应是按原句唯一匹配，不表示学生已经掌握前项或形成量化进阶。","key":false,"verified":true},{"eid":"四下-八-2","uid":"四下-八","link":"本要素要求按自己的想法新编故事，归入表达组织。教参以重组《龟兔赛跑》情节、设计结局说明新编方法，并说明创编故事与本单元童话阅读配合；因此与四下-八-1记录为同单元读写实践关联，但阅读体会不等于已能独立新编故事。","key":false,"verified":true},{"eid":"五上-一-2","uid":"五上-一","link":"教参印刷p1/PDF16明确说，本单元阅读五上-一-1“初步体会文章借助具体事物表达的思想感情”和习作“写一种心爱的事物，表达自己的感情”共同指向借助具体事物表达情感。阅读体验与书面表达是不同任务；教师用书说明读写目标共同指向，不证明前者会自动迁移为写作能力。","key":false,"verified":true},{"eid":"五上-二-2","uid":"五上-二","link":"本要素要求结合具体事例写出人物特点，归入表达组织。教参印刷p27/PDF42指导先想人物特点，再选择一两件能突出特点的事例；教参只概括中年级已有相关练习、未点名具体单元ID，不补猜测的前序关系。 另据五下教师用书印刷p106/PDF122，五上“结合具体事例写出人物的特点”与该节点原句唯一匹配，现补登记五下-五-1对本要素的教学回指；不据此断言学生已掌握或线性进阶。 六上教师用书印刷p203/PDF218明确称六上-八-2“选取典型事例，写一写好家风”承接五年级“结合具体事例写出人物的特点”；这是教参回指，不代表前项已掌握或能力等级。","key":false,"verified":true},{"eid":"五上-三-2","uid":"五上-三","link":"教参说明习作新编故事以三年级编童话、四年级奇思妙想为基础，并称本单元创造性复述的实践可支持构想新情节。阅读五上-三-1的实践为习作五上-三-2提供支持；读写关联不表示读会复述即可独立新编。 五下教师用书印刷p124/PDF140回顾此前“按自己的想法新编故事”的学习经历，与本节点原句匹配，现补登记五下-六-2教学回指；不据此断言掌握或线性进阶。","key":false,"verified":true},{"eid":"五上-四-2","uid":"五上-四","link":"要求落到落笔之前的思路组织（列提纲）。","key":true,"verified":true},{"eid":"五上-五-1","uid":"五上-五","link":"教参明确阅读五上-五-1学习说明方法，习作五上-五-2搜集资料并运用方法介绍事物，形成“从学到用”的单元联系；阅读和资料运用仍是不同任务。","key":false,"verified":true},{"eid":"五上-六-2","uid":"五上-六","link":"教参明示阅读五上-六-1体会细节中的情感，为习作五上-六-2表达自己的看法和感受提供方法迁移；读中体会与个人表达不等同。 六上教师用书印刷p59/PDF74明确将本单元“写生活体验，试着表达自己的看法”与五上表达看法和感受的要求相比较：六上更聚焦内容选择、观点形成原因和材料组织。该教学安排不证明学生已掌握前项或构成统一线性进阶。","key":false,"verified":true},{"eid":"五上-七-2","uid":"五上-七","link":"教参以五上-七-2“写出景物特点”比较四下-一-2和四下-五-2等写景任务。教参把四下第五单元概述为“初步写出景物特点”，但所给教材四下-五-2原句聚焦按游览顺序写景物；两者焦点不同，此处只记录教学比较，不认作原句或必然进阶。","key":false,"verified":true},{"eid":"五上-八-2","uid":"五上-八","link":"要求分段表述并突出重点，由表达需要决定。","key":true,"verified":true},{"eid":"五下-一-2","uid":"五下-一","link":"教参说明阅读五下-一-1体会课文思想感情与习作五下-一-2写童年往事、把重点部分写具体体现读写结合；阅读感受不替代写具体事件。","key":false,"verified":true},{"eid":"五下-二-2","uid":"五下-二","link":"教参印刷p31/PDF47要求把阅读文章或书籍时的思考与感受写下来并清楚表达；本要素指向读后感写作，不把具体文体格式当作一般能力递进。","key":false,"verified":true},{"eid":"五下-四-2","uid":"五下-四","link":"教参印刷p80/PDF96明确说明阅读中体会人物内心的方法要运用到本单元习作“他___了”；与五下-四-1双端登记。读中理解不等同写作表现已达成。","key":false,"verified":true},{"eid":"五下-五-2","uid":"五下-五","link":"【习作实践】运用本单元学习的描写人物基本方法进行习作产出，具体表现一个人的特点。","key":false,"verified":true},{"eid":"五下-六-2","uid":"五下-六","link":"教参印刷p124/PDF140回顾此前“按自己的想法新编故事”的学习经历，与五上-三-2原句唯一匹配；这是教参明示的教学回指，不表示前项已掌握或构成线性进阶。本单元分别列阅读和习作要素，未明示阅读端为本习作先修。","key":false,"verified":true},{"eid":"六上-一-2","uid":"六上-一","link":"教参印刷p1/PDF16说明本次习作依托阅读课文、感受作者想象经验，并把重点部分写详细；教参未指出某个既有单元要素为前驱，不建立具体跨单元关系。","key":false,"verified":true},{"eid":"六上-二-1","uid":"六上-二","link":"教参印刷p32/PDF47要求通过阅读体会点与面的安排及其表达作用，并明确把阅读方法迁移到本单元习作；这是教参安排的读写联系，不代表学生已掌握或阅读理解等于写作表现。","key":false,"verified":true},{"eid":"六上-二-2","uid":"六上-二","link":"教参印刷p32/PDF47说明将阅读所得点面结合写场面的方法迁移到习作，关注整体场面和个体表现；与六上-二-1形成教参明示的读写联系，不作达成或能力进阶证明。","key":false,"verified":true},{"eid":"六上-三-2","uid":"六上-三","link":"教参印刷p59/PDF74明确以五年级上册“用恰当的语言表达自己的看法和感受”为基础，指出六上更聚焦从生活体验选取内容、写清形成看法的原因并围绕观点组织材料。该联系反映教参提出的教学要求差异，不证明学生已掌握前项或形成统一线性进阶。","key": 4,"total":26,"prev":"六上-七-1","next":"六下-二-3","link":"教参印刷p41/PDF55说明作品梗概是把握名著主要内容的方法；本要素重在阅读理解，不把梗概写作本身当作其达成证据。"}],"六下-二-3":[{"line":"内容与信息把握","index":25,"total":26,"prev":"六下-二-1","next":null,"link":"教参印刷p41/PDF55把阅读作品、阅读梗概和学习写作品梗概作为同单元安排，并说明梗概是对作品主要内容的浓缩概括。该联系是阅读支架与写作任务的教学设计，不表示读懂作品就自动能写好梗概。"}],"二上-七-1":[{"line":"形象与情感理解","index":0,"total":19,"prev":null,"next":"二下-二-1","link":"想象指向初步的情感体验；课标第一学段目标有相同表述，保留“初步”，不从教材顺序推出稳定进阶。"}],"二下-二-1":[{"line":"形象与情感理解","index":1,"total":19,"prev":"二上-七-1","next":"二下-四-1","link":"把想象落到句子、建构画面；教参明确回指二上七。此为教参说明的学习安排联系，不证明前项已掌握或构成等级。"}],"二下-四-1":[{"line":"形象与情感理解","index":2,"total":19,"prev":"二下-二-1","next":"三上-四-1","link":"用想象理解童话内容；教参列举二上七与二下二为此前安排。这里对应想象体验，不把“理解内容”并入情感目标，也不推成递进。"}],"三上-四-1":[{"line":"形象与情感理解","index":3,"total":19,"prev":"二下-四-1","next":"四上-四-1","link":"本单元把阅读童话落在丰富想象与真善美体验上，核心对象是文学作品中的形象、情感和价值体验，归入本线有课标目标支持；教参未将它明确连到某个前项，教材先后只表示位置，不表示递进。"}],"四下-一-1":[{"line":"形象与情感理解","index":5,"total":19,"prev":"四上-四-1","next":"四下-三-1","link":"本单元阅读要素“抓住关键词句，初步体会课文表达的思想感情”：教参印刷p1/PDF15说明这一阅读体验为同单元写喜爱地方、表达感受提供范例；印刷p106/PDF120又明确四下四在本要素基础上进一步关注作家如何表达感情。前者是读写配合，后者是教参明示的教学要求联系；均不证明学生已经掌握。"}],"四下-三-1":[{"line":"形象与情感理解","index":6,"total":19,"prev":"四下-一-1","next":"四下-四-1","link":"教参印刷页67/PDF81把本单元定位为现代诗学习，要求初步了解特点并通过朗读体会诗歌情感；同时提醒避免过度解读、成人化或学术化分析。归入形象与情感理解只承接诗歌情感体验；文体特点认知保留“初步”边界，不扩成格律、修辞或深度词句分析。"}],"四下-四-1":[{"line":"形象与情感理解","index":7,"total":19,"prev":"四下-三-1","next":"四下-七-1","link":"教参印刷页106/PDF120明确说明，本要素在第一单元“初步体会课文表达的思想感情”基础上，进一步要求不仅体会文章感情，还关注作家如何表达。这是明确的教参教学安排联系，不证明学生已掌握第一单元内容或能力必然递进。"}],"四下-七-1":[{"line":"形象与情感理解","index":8,"total":19,"prev":"四下-四-1","next":"四下-八-1","link":"体会对象改为人物品质，抓手是人物描写。"}],"四下-八-1":[{"line":"形象与情感理解","index":9,"total":19,"prev":"四下-七-1","next":"五上-一-1","link":"本要素要求感受童话想象的奇妙并体会人物真善美形象，归入形象与情感理解。教参印刷p217/PDF231比较三年级上册的童话学习时写“第三单元”，但教材原页中相同要素实际在三上第四单元，第三单元是预测；故保留来源矛盾，不建立三上具体前驱。教参同时说明本单元阅读与新编故事习作相互配合，具体写作端见四下-八-2；不把阅读体验当成写作达成。"}],"五上-一-1":[{"line":"形象与情感理解","index":10,"total":19,"prev":"四下-八-1","next":"五上-四-1","link":"抓手是具体事物，仍写明“初步”。教参印刷p1/PDF16明确说本单元阅读与习作共同指向借助具体事物表达情感；阅读端是体会作者表达，五上-一-2是书面表达个人感情，二者目标相关但表现任务不同，不证明读中体会自动迁移为写作达成。"}],"五上-四-1":[{"line":"形象与情感理解","index":11,"total":19,"prev":"五上-一-1","next":"五上-六-1","link":"本单元明确要求结合资料体会思想感情，程度用“深入”。"},{"line":"资料运用","index":5,"total":14,"prev":"四下-三-3","next":"五上-五-2","link":"本单元明确要求结合资料体会思想感情。 用户提出的同一条件假设：资料量大时，五上二提速阅读可能支持本单元资料初读与筛选理解；效果待课堂观察，非教材/课标明示，不作普遍先修。"}],"五上-六-1":[{"line":"形象与情感理解","index":12,"total":19,"prev":"五上-四-1","next":"五下-一-1","link":"抓手是细节描写，情感见于细处。 教参印刷p163/PDF178明示阅读中的细节体会为五上-六-2习作表达看法和感受提供迁移方法；不据此认定迁移已发生。"}],"五下-一-1":[{"line":"形象与情感理解","index":13,"total":19,"prev":"五上-六-1","next":"五下-四-1","link":"不再写明抓手，直接要求体会思想感情。 教参印刷p1/PDF17称本单元阅读与习作体现读写结合；习作端五下-一-2将童年往事重点部分写具体，体会课文情感不替代写作表现。"}],"五下-四-1":[{"line":"形象与情感理解","index":14,"total":19,"prev":"五下-一-1","next":"五下-五-1","link":"对象是人物内心，抓手是动作、语言、神态描写。 教参印刷p80/PDF96明确把阅读中体会人物内心的方法用于五下-四-2习作“他___了”；这是读写方法迁移安排，不等同学生已能写出人物内心。"}],"五下-五-2":[{"line":"表达组织","index":36,"total":51,"prev":"五下-四-2","next":"五下-六-2","link":"【习作实践】运用本单元学习的描写人物基本方法进行习作产出，具体表现一个人的特点。"}],"六上-四-1":[{"line":"形象与情感理解","index":16,"total":19,"prev":"五下-五-1","next":"六下-三-1","link":"对象是小说人物形象，借助情节与环境。"}],"六下-三-1":[{"line":"形象与情感理解","index":17,"total":19,"prev":"六上-四-1","next":"六下-四-1","link":"对象是文章怎样表达情感，落点在表达方式。 六下教师用书印刷p77/PDF91指出，两篇精读课文和交流平台围绕表达真实情感展开，并作为习作准备；这是教学设计中的跨路径读写联系，阅读理解不替代写作表现。"}],"六下-四-1":[{"line":"形象与情感理解","index":18,"total":19,"prev":"六下-三-1","next":null,"link":"对象回到人物品质，抓手是外貌、神态、言行描写。"}],"三下-四-2":[{"line":"资料运用","index":0,"total":14,"prev":null,"next":"三下-七-2","link":"围绕节日主题收集资料；同单元另有写过节情景的要求。"}],"三下-七-2":[{"line":"资料运用","index":1,"total":14,"prev":"三下-四-2","next":"四上-六-2","link":"信息整合之后用于介绍一种事物。"}],"四上-六-2":[{"line":"资料运用","index":2,"total":14,"prev":"三下-七-2","next":"四下-三-2","link":"为明确的介绍对象收集、整理资料。"}],"四下-三-2":[{"line":"资料运用","index":3,"total":14,"prev":"四上-六-2","next":"四下-三-3","link":"写明“根据需要”，收集是有选择的；同时要求初步学习整理方法。"}],"四下-三-3":[{"line":"资料运用","index":4,"total":14,"prev":"四下-三-2" 顺序写成掌握证明或本线正式连线。"}],"三下-三-2":[{"line":"表达组织","index":6,"total":51,"prev":"三下-二-2","next":"三下-四-1","link":"本要素要求将小实验过程写清楚，是程序性过程表达；它与围绕中心意思写段落、写一件事等任务不同。归入表达组织线只表示都涉及清楚组织信息，不代表同一文体、同一评价量规或教材先后进阶。"}],"三下-四-1":[{"line":"表达组织","index":7,"total":51,"prev":"三下-三-2","next":"三下-五-2","link":"这是从阅读角度学习段落如何围绕一个意思组织并写清楚，能为后续表达方法提供认识；教材原句要求“了解”，不等于学生已能独立写出或迁移运用。它与本线的其他写作任务共享组织表达这一方向，但不是写作达成证据。"}],"三下-五-2":[{"line":"表达组织","index":8,"total":51,"prev":"三下-四-1","next":"三下-六-2","link":"教参p132/PDF144明示三上第四单元“童话世界”的阅读与编写为本单元想象故事写作打基础；p213/PDF225明示本册第八单元在本单元想象故事写作基础上继续编写童话。两处都是教参说明的教材安排，不证明学生已掌握、两个习作要求完全同类或质量递进。"}],"三下-六-2":[{"line":"表达组织","index":9,"total":51,"prev":"三下-五-2","next":"三下-八-2","link":"教参回顾二下写话“我的好朋友”和三上“猜猜他是谁”作为此前写人练习，并说明本单元转向抓人物特点、用事例表现特点。四上第二单元教参又将“身边那些有特点的人”与“我的家人”列为第三次写人习作。四下第七单元教参印刷p190/PDF204引用三年级下册“写一个身边的人，尝试写出他的特点”，与本要素原句唯一匹配，因此补记四下-七-2的后续任务联系。以上均是教参描述的教学安排，不证明学生已掌握或学业质量必然提升。"}],"三下-八-2":[{"line":"表达组织","index":10,"total":51,"prev":"三下-六-2","next":"四上-一-2","link":"教参明确本单元根据提示编写童话是在三下第五单元“奇妙的想象”习作基础上的继续练习。这是教参写明的教材教学安排，不证明学生已掌握、两项完全同类、形成质量进阶或构成必然先修。"}],"四上-一-2":[{"line":"表达组织","index":11,"total":51,"prev":"三下-八-2","next":"四上-二-2","link":"推荐一个地点并写清理由，是面向他人的推荐表达；教参强调介绍自己喜欢的地方、清楚充分说明理由。归入表达组织体现书面理由组织，不扩写成完整论证结构或说服能力达成标准。"}],"四上-二-2":[{"line":"表达组织","index":12,"total":51,"prev":"四上-一-2","next":"四上-四-2","link":"四上第二单元教参印刷页31/PDF45把“猜猜他是谁”→“身边那些有特点的人”→本单元“我的家人”列为本套教材第三次写人习作，说明要求逐步提升；“身边那些有特点的人”与三下第六单元要素“写一个身边的人，尝试写出这个人的特点”相对应。本图记录教参所述的任务安排，不证明学生已掌握或能力等级必然提升；这里是写作选材与表达，不是阅读人物形象。"}],"四上-四-2":[{"line":"表达组织","index":13,"total":51,"prev":"四上-二-2","next":"四上-五-1","link":"本要素要求展开想象写故事，归入表达组织。教参印刷页97/PDF111提到三年级习作安排过创编童话、发挥想象写故事，并说明本单元围绕熟悉的神话或童话人物继续创作；教参没有点名单元ID，因此不把它硬连到三下第五或第八单元的具体节点，也不据此认定掌握或质量进阶。"}],"四上-五-1":[{"line":"表达组织","index":14,"total":51,"prev":"四上-四-2","next":"四上-五-2","link":"本要素是阅读中了解作者怎样把一件事写清楚，学习焦点是叙事组织方法；同单元另有习作“写一件事，把事情写清楚”，二者构成读写配对，但阅读分析不等于学生已经能独立写清楚。归入表达组织只表示学习如何组织叙事信息。教参印刷页127/PDF141未指明与其他单元要素的具体连线。"}],"四上-五-2":[{"line":"表达组织","index":15,"total":51,"prev":"四上-五-1","next":"四上-七-2","link":"教参印刷页127/PDF141将第五单元习作概括为“写一件事，把事情写清楚”；印刷页181/PDF195明确说第七单元在此基础上增加按起因、经过、结果写事及呈现各阶段心情变化。这是教材教学安排联系，不证明学生已掌握前项或质量等级递进。"}],"四上-七-2":[{"line":"表达组织","index":16,"total":51,"prev":"四上-五-2","next":"四下-一-2","link":"教参印刷页127/PDF141将第五单元习作目标概括为“写一件事，把事情写清楚”；印刷页181/PDF195明确说明第七单元建立在该习作基础上，增加写出事情起因、经过、结果及各阶段心情变化。这是教参明示的教材安排联系，不表示学生已掌握前项或已经达到更高质量等级；写出自己的感受是写作内容，不等同于阅读人物情感。"}],"四下-一-2":[{"line":"表达组织","index":17,"total":51,"prev":"四上-七-2","next":"四下-二-2","link":"教师用书印刷页1/PDF15明确说明，阅读中抓关键语句、初步体会思想感情，为写喜爱的地方并表达自己的感受提供范例。这是同单元读写支持；读懂情感不等于已经会写出自己的感受。 五上教参印刷p194/PDF209将其与五上-七-2“写出景物特点”比较：四下此项偏整体感受，五上聚焦景物特征；是教学比较，不是先修门槛。"}],"四下-二-2":[{"line":"表达组织","index":18,"total":51,"prev":"四下-一-2","next":"四下-四-2","link":"本要素要求围绕想发明的事物展开奇思妙想并用文字写出想法，归入表达组织。教参印刷页32/PDF46说明文字描述想法可激发想象与创造；它不是故事续写，也未规定说明文结构。"}],"四下-四-2":[{"line":"表达组织","index":19,"total":51,"prev":"四下-二-2","next":"四下-五-1","link":"同单元写作要素改为写自己喜欢的动物、试着写出特点；阅读要素关注作家如何表达对动物的感情。题材相近但学习任务不同，不能以阅读体会替代写作表现，也不据此推出阅读为习作的必然先修。"}],"四下-五-1":[{"line":"表达组织","index":20,"total":51,"prev":"四下-四-2","next":"四下-五-2","link":"本要素要求读中了解课文按一定顺序写景物的方法；教参印刷p136/PDF150又明确把它与同单元习作四下-五-2“学习按游览的顺序写景物”配合，作为阅读范例支持习作实践。两项关系现已双端登记；不等于学生已能独立写景。教参对三、四年级经验未点具体单元，不补具体前序ID。"}],"四下-五-2":[{"line":"表达组织","index":21,"total":51,"prev":"四下-五-1","next":"四下-六-2","link":"本要素要求学习按游览顺序写景物，与四下-五-1“了解课文按一定顺序写景物的方法”构成同单元阅读与习作配合。教参印刷p136/PDF150明确把阅读中学习写景顺序作为习作实践准备；这是教材任务安排，不证明学生已经掌握写景方法或完成习作。 五上教参印刷p194/PDF209还比较五上-七-2。教参对四下五的概述“初步写出景物特点”与所给教材原句“学习按游览的顺序写景物”焦点不同，保留为教学比较，不改教材原句或认作线性进阶。"}],"四下-六-2":[{"line":"表达组织","index":22,"total":51,"prev":"四下-五-2","next":"四下-七-2","link":"增加“按一定顺序”这一组织手段。"}],"四下-七-2":[{"line":"表达组织","index":23,"total":51,"prev":"四下-六-2","next":"四下-八-2","link":"教参印刷p190/PDF204回顾三年级下册写“一个身边的人，尝试写出他的特点”的练习，并说本单元进一步学习从多个方面写人物特点。该原句与教材要素三下-六-2唯一匹配，故记录为教参明示的教学任务联系；教参未写单元编号，此处对应是按原句唯一匹配，不表示学生已经掌握前项或形成量化进阶。"}],"四下-八-2":[{"line":"表达组织","index":24,"total":51,"prev":"四下-七-2","next":"五上-一-2","link":"本要素要求按自己的想法新编故事，归入表达组织。教参以重组《龟兔赛跑》情节、设计结局说明新编方法，并说明创 认读汉字，学会用音序检字法和部首检字法查字典。","page":7,"short":"学习独立识字"}],"阅读与鉴赏":[{"no":1,"text":"喜欢阅读，感受阅读的乐趣。学习用普通话正确、流利、有感情地朗读课文。学习默读。","page":7,"short":"学习用普通话正确、流利、有感情地朗读课文；学习默读","pageSpan":"7～8","pdfPageSpan":"10～11"},{"no":2,"text":"结合上下文和生活实际了解课文中词句的意思，在阅读中积累词语。认识课文中出现的常用标点符号，在阅读中体会句号、问号、感叹号所表达的不同语气。借助读物中的图画阅读。","page":8,"short":"结合上下文和生活实际了解课文中词句的意思，在阅读中积累词语"},{"no":3,"text":"阅读浅近的童话、寓言、故事，向往美好的情境，关心自然和生命，对感兴趣的人物和事件有自己的感受和想法，并乐于与他人交流。诵读儿歌、儿童诗和浅近的古诗，展开想象，获得初步的情感体验，感受语言的优美。","page":8,"short":"阅读浅近的童话、寓言、故事，向往美好的情境，关心自然和生命"},{"no":4,"text":"尝试阅读整本书，用自己喜欢的方式向他人介绍读过的书。养成爱护图书的习惯。","page":8,"short":"尝试阅读整本书，向他人介绍读过的书并爱护图书"},{"no":5,"text":"积累自己喜欢的成语和格言警句。背诵优秀诗文50篇(段)。课外阅读总量不少于5万字。","page":8,"short":"积累自己喜欢的成语和格言警句"}],"表达与交流":[{"no":1,"text":"学说普通话，逐步养成说普通话的习惯，有表达交流的自信心。","page":8,"short":"学说普通话，逐步养成说普通话习惯，树立表达自信心"},{"no":2,"text":"能认真听他人讲话，努力了解讲话的主要内容。听故事、看影视作品，能复述大意和自己感兴趣的情节。能较完整地讲述小故事，能简要讲述自己感兴趣的见闻。与他人交谈，态度自然大方，有礼貌。积极参加讨论，敢于发表自己的意见。","page":8,"short":"听故事、看音像作品，能复述大意和精彩情节；能较完整地讲述小故事"},{"no":3,"text":"对写话有兴趣，留心周围事物，写自己想说的话，写想象中的事物。在写话中乐于运用阅读和生活中学到的词语。","page":8,"short":"对写话有兴趣，留心周围事物，写想说的话，乐于运用词语"},{"no":4,"text":"根据表达的需要，学习使用逗号、句号、问号、感叹号。","page":8,"short":"根据表达需要，学习使用逗号、句号、问号、感叹号"}],"梳理与探究":[{"no":1,"text":"观察字形，体会汉字部件之间的关系。梳理学过的字，感知汉字与生活的联系。","page":8,"short":"观察字形，体会汉字部件之间的关系；梳理学过的字，感知汉字与生活的联系"},{"no":2,"text":"观察大自然，热心参加校园、社区活动，积累活动体验。结合语文学习，用口头或图文等方式整理、表达自己在活动中的见闻和想法。","page":8,"short":"观察大自然，热心参加校园、社区活动，积累活动体验，整理表达见闻和想法","pageSpan":"8～9","pdfPageSpan":"11～12"},{"no":3,"text":"对周围事物有好奇心，能就感兴趣的内容提出问题，结合其他学科的学习和生活经验交流讨论，尝试提出自己的看法。","page":9,"note":"【学段收束说明】在落实以上要求过程中，注重引导学生关注中华优秀传统文化在日常生活中的表现，初步感受中华优秀传统文化的重要价值；初步懂得幸福生活是革命前辈浴血奋战、艰苦奋斗换来的，激发对革命领袖、革命家、英雄人物的崇敬之情；关注当代社会新面貌，感受当代社会的新变化。（印刷第9页）","short":"对周围事物有好奇心，能提出问题并交流讨论，尝试提出自己的看法"}]}},"第二学段":{"grades":"3～4年级","print_page":9,"domains":{"识字与写字":[{"no":1,"text":"对学习汉字有浓厚的兴趣，养成主动识字的习惯。累计认识常用汉字2500个左右，其中1600个左右会写。有初步的独立识字能力。能用音序检字法和部首检字法查字典、词典。","page":9,"short":"对学习汉字有浓厚的兴趣，养成主动识字的习惯"},{"no":2,"text":"写字姿势正确，养成良好的书写习惯。能用硬笔熟练地书写正楷字，做到规范、端正、整洁。用毛笔临摹正楷字帖，感受汉字的书写特点和形体美。","page":9,"short":"写字姿势正确，养成良好的书写习惯"},{"no":3,"text":"能感知常用汉字形、音、义之间的联系，初步建立汉字与生活中事物、行为的联系，初步感受汉字的文化内涵。","page":9,"short":"能感知常用汉字形、音、义之间的联系，初步建立汉字与生活中事物、行为的联系，初步感受汉字的文化内涵"}],"阅读与鉴赏":[{"no":1,"text":"用普通话正确、流利、有感情地朗读课文。初步学会默读，做到不出声，不指读。学习略读，粗知文章大意。","page":9,"short":"用普通话正确、流利、有感情地朗读课文；初步学会默读，学习略读"},{"no":2,"text":"能联系上下文，理解词句的意思，体会课文中关键词句表达情意的作用。能借助字典、词典和生活积累，理解生词的意义。在理解语句的过程中，体会句号与逗号的不同用法，了解冒号、引号的一般用法。","page":9,"short":"能联系上下文，理解词句的意思，体会课文中关键词句表达情意的作用","pageSpan":"9～10","pdfPageSpan":"12～13"},{"no":3,"text":"能初步把握文章的主要内容，体会文章表达的思想感情。学习圈点、批注等阅读方法。能对课文中不理解的地方提出疑问，乐于与他人讨论交流。","page":10,"short":"把握主要内容与思想感情，学习圈点批注，提出疑问与讨论交流"},{"no":4,"text":"能复述叙事性作品的大意，初步感受作品中生动的形象和优美的语言，关心作品中人物的命运和喜怒哀乐，与他人交流自己的阅读感受。诵读优秀诗文，注意在诵读过程中体验情感，展开想象，领悟诗文大意。","page":10,"short":"复述叙事性作品的大意，初步感受生动的形象和优美的语言，关心人物命运"},{"no":5,"text":"阅读整本书，初步理解主要内容，主动和同学分享自己的阅读感受。","page":10,"short":"阅读整本书，初步理解主要内容，主动和同学分享自己的阅读感受"},{"no":6,"text":"积累课文中的优美词语、精彩句段，以及在课外阅读和生活中获得的语言材料。背诵优秀诗文50篇(段)。养成读书看报的习惯，收藏图书资料，乐于与同学交流。课外阅读总量不少于40万字。","page":10,"short":"积累课文中的优美词语、精彩句段，以及在课外阅读和生活中获得的语言材料"}],"表达与交流":[{"no":1,"text":"乐于用口头、书面的方式与人交流沟通，愿意与他人分享，增强表达的自信心。","page":10,"short":"乐于用口头、书面的方式与人交流沟通，愿意与他人分享，增强表达的自信心"},{"no":2,"text":"能用普通话交谈，学会认真倾听，听人说话时能把握主要内容，并能简要转述。能就不理解的地方向人请教，就不同的意见与人商讨。","page":10,"short":"能用普通话交谈，学会认真倾听，听人说话时能把握主要内容，并能简要转述"},{"no":3,"text":"能清楚明白地讲述见闻，说出自己的感受和想法。讲述故事力求具体生动。能主动参与日常生活中的文化活动，根据不同的场合，尝试运用合适的音量和语气与他人交流，有礼貌地请教、回应。","page":10,"short":"能清楚明白地讲述见闻，说出自己的感受和想法"},{"no":4,"text":"观察周围世界，能不拘形式地写下自己的见闻、感受和想象，注意把自己觉得新奇有趣或印象最深、最受感动的内容写清楚。能用便条、简短的书信等进行交流。尝试在习作中运用自己平时积累的语言材料，特别是有新鲜感的词句。","page":10,"short":"观察周围世界，能不拘形式地写下见闻、感受和想象，把新奇有趣或印象最深的内容写清楚"},{"no":5,"text":"学习修改习作中有明显错误的词句。根据表达的需要，正确使用冒号、引号等标点符号。课内习作每学年16次左右。","page":11,"short":"学习修改习作中有明显错误的词句"}],"梳理与探究":[{"no":1,"text":"尝试分类整理学过的字词。尝试发现所学汉字形、音、义和书写的特点，帮助自己识字、写字。","page":11,"short":"尝试分类整理学过的字词"},{"no":2,"text":"学习组织有趣味的语文实践活动，在活动中学习语文，学会合作。结合语文学习，观察大自然，观察社会，积极思考，运用书面或口头方式，并可尝试用表格、图像、音频等多种媒介，呈现自己的观察与探究所得。","page":11,"short":"学习组织有趣味的语文实践活动，在活动中学习语文，学会合作"},{"no":3,"text":"能提出学习和生活中的问题，有目的地搜集资料，共同讨论，尝试运用语文并结合其他学科知识解决问题。","page":11,"note":"【学段收束说明】在落实以上要求过程中，注重感悟国家通用语言文字的文化内涵，初步认识中华优秀传统文化蕴含的思想和智慧；感悟革命英雄、模范人物的爱国主义情怀和高尚品质，激发向英雄模范学习的意愿和行动，培养对中国共产党和中华人民共和国的朴素情感，增强民族自豪感；了解实现社会主义现代化和中华民族伟大复兴的历程，关注中国特色社会主义发展的新成就。（印刷第11页）","short":"能提出学习和生活中的问题，有目的地搜集资料，共同讨论，尝试解决问题"}]}},"第三学段":{"grades":"5～6年级","print_page":11,"domains":{"识字与写字":[{"no":1,"text":"有较强的独立识字能力。累计认识常用汉字3000个左右，其中2500个左右会写。感受汉字的构字组词特点，体会汉字蕴含的智慧。","page":11,"short":"有较强的独立识字能力"},{"no":2,"text":"写字姿势正确，有良好的书写习惯。硬笔书写楷书，行款整齐，力求美观，有一定的速度。能用毛笔书写楷书，在书写中体会汉字的优美。","page":11,"short":"写字姿势正确，有良好的书写习惯"}],"阅读与鉴赏":[{"no":1,"text":"熟练地用普通话正确、流利、有感情地朗读课文。默读有一定的速度，默读一般读物每分钟不少于300字。学习浏览，扩大知识面，根据需要搜集信息。","page":12,"short":"熟练朗读，默读有一定速度，学习浏览，扩大知识面，根据需要搜集信息"},{"no":2,"text":"能联系上下文和自己的积累，推想课文中有关词句的意思，辨别词语的感情色彩，体会其表达效果。在理解课文的过程中体会顿号与逗号、分号与句号的不同用法。","page":12,"short":"推想词句意思，辨别感情色彩，体会表达效果"},{"no":3,"text":"在阅读中了解文章的表达顺序，体会作者的思想感情，初步领悟文章的基本表达方法。在交流和讨论中，敢于提出看法，作出自己的判断。","page":12,"short":"了解文章表达顺序，体会作者思想感情，领悟基本表达方法"},{"no":4,"text":"阅读叙事性作品，了解事件梗概，能简单描述印象最深的场景、人物、细节，说出自己的喜爱、憎恶、崇敬、向往、同情等感受；阅读诗歌，大体把握诗意，想象诗歌描述的情境，体会作品的情感。受到优秀作品的感染和激励，向往和追求美好的理想。","page":12,"short":"阅读叙事性作品了解梗概，简单描述场景人物细节，体会作品情感"},{"no":5,"text":"阅读说明性文章，能抓住要点，了解文章的基本说明方法。阅读简单的非连续性文本，能从图文等组合材料中找出有价值的信息。尝试使用多种媒介阅读。","page":12,"short":"阅读说明性文章，抓住要点，了解基本的说明方法"},{"no":6,"text":"阅读整本书，把握文本的主要内容，积极向同学推荐并说明理由。","page":12,"short":"阅读整本书，把握文本的主要内容，积极向同学推荐并说明理由"},{"no":7,"text":"背诵优秀诗文60篇(段),注意通过语调、韵律、节奏等体味作品的内容和情感。扩展阅读面，课外阅读总量不少于100万字。","page":12,"short":"背诵优秀诗文60篇(段),注意通过语调、韵律、节奏等体味作品的内容和情感"}],"表达与交流":[{"no":1,"text":"听人说话认真、耐心，能抓住要点，并能简要转述。乐于表达，与人交流能尊重和理解对方。注意语言美，抵制不文明的语言。","page":12,"short":"听人说话认真、耐心，能抓住要点，并能简要转述"},{"no":2,"text":"表达有条理，语气、语调适当。参与讨论，敢于发表自己的意见，说清自己的观点。能根据对象和场合，稍作准备，作简单的发言。","page":12,"short":"表达有条理，语气、语调适当","pageSpan":"12～13","pdfPageSpan":"15～16"},{"no":3,"text":"懂得写作是为了自我表达和与人交流。养成留心观察周围事物的习惯，有意识地丰富自己的见闻，珍视个人的独特感受，积累习作素材。","page":13,"short":"懂得写作是为了自我表达和与人交流"},{"no":4,"text":"能写简单的记实作文和想象作文，内容具体，感情真实。能根据内容表达的需要，分段表述。学写读书笔记，学写常见应用文。","page":13,"short":"写简单的记实作文和想象作文，内容具体、感情真实；根据需要分段表述"},{"no":5,"text":"修改自己的习作，并主动与他人交换修改，做到语句通顺，行款正确，书写规范、整洁。根据表达需要，正确使用常用的标点符号。习作要有一定速度。课内习作每学年16次左右。","page":13,"short":"修改习作并主动交换修改，语句通顺，行款正确，书写规范整洁"}],"梳理与探究":[{"no":1,"text":"分类整理学过的字词，发现所学汉字形、音、义和书写的特点，发展独立识字能力和写字能力。","page":13,"short":"分类整理学过的字词，发现所学汉字形、音、义和书写的特点，发展独立识字能力和写字能力"},{"no":2,"text":"感受不同媒介的表达效果，学习跨媒介阅读与运用，初步运用多种方法整理和呈现信息。","page":13,"short":"感受不同媒介表达效果，跨媒介阅读，初步运用多种方法整理和呈现信息"},{"no":3,"text":"初步了解查找资料、运用资料的基本方法。利用图书馆、网络等渠道获取资料，解决与学习和生活相关的问题。尝试写简单的研究报告。","page":13,"short":"初步了解查找资料、运用资料的基本方法，解决相关问题，尝试写简单研究报告"},{"no":4,"text":"策划简单的校园活动和社会活动，对所策划的主题进行讨论和分析，学写活动计划和活动总结。对自己身边的、大家共同关注的问题，或影视作品中的故事和形象，通过调查访问、讨论演讲等方式，开展专题探究活动，学习辨别是非、善恶、美丑。","page":13,"short":"策划简单的校园活动和社会活动，学写活动计划和活动总结","note":"【学段收束说明】在落实以上要求过程中，注重了解中华优秀传统文化的源远流长、丰富多彩，提升自身中华优秀传统文化修养；感受先贤志士的人格魅力，感悟老一辈无产阶级革命家的英雄气概、优良作风和高尚品质，体会捍卫民族尊严、维护国家利益和世界和平的伟大精神；初步形成对社会主义先进文化的认识。（印刷第13页）"}]}}},"crossDomainLinks":{"五上-四-1":[["第三学段","阅读与鉴赏",3]],"六上-八-1":[["第三学段","阅读与鉴赏",3],["第三学段","阅读与鉴赏",1]],"六下-四-2":[["第三学段","阅读与鉴赏",3]]},"elementEvidenceMap":{"六上-八-1":{"资料运用":{"perElement":true,"directTargets":[{"xd":"第三学段","dom":"梳理与探究","no":3,"reason":"【主要依据】借助相关资料，加深对课文主要内容的理解。"},{"xd":"第三学段","dom":"阅读与鉴赏","no":1,"reason":"【资料搜集依据】第1条要求学习浏览、扩大知识面并根据需要搜集信息，与按目的查找、运用资料直接相关。"}],"otherTargets":[],"directQualities":[],"otherQualities":[]}},"五上-四-1":{"形象与情感理解":{"perElement":true,"directTargets":[{"xd":"第三学段","dom":"阅读与鉴赏","no":3,"reason":"【主要依据】在阅读中结合背景资料体会作者的思想感情。"},{"xd":"第三学段","dom":"阅读与鉴赏","no":4,"reason":"【主要依据】阅读叙事作品与诗歌，大体把握诗意，体会作品的情感。"}],"otherTargets":[],"directQualities":[{"xueduan":"第三学段","chapter":"五、学业质量 → (二)学业质量描述 → 第三学段","printPage":"41","pdfPage":"44","text":"能借助与文本相关的材料，结合作品关键语句评价文本中的主要事件和人物，提出自己的观点或看法；能发现不同类型文本的结构方式和语言特点，感受作品内容、表现形式上的不同，积极向他人推荐，并有条理地说明推荐理由。","short":"评价主要事件与人物，把握结构特点","scope":"第三学段整体阅读综合表现参照；对具体要素属综合评价与结构感知参照。"}],"otherQualities":[]},"资料运用":{"perElement":true,"directTargets":[{"xd": function nodeOrderKey(eid){

function kbCard(xd, dom, no){
  const items = (D.kbiao[xd] && D.kbiao[xd].domains[dom]) || [];
  return items.find(x=>x.no===no) || null;
}

/* ================= 统一的依据选择逻辑（页面、PNG、PDF、Markdown 完全共用） ================= */
function evidenceLinksOf(eid, viewLinks){
  return viewLinks.length ? viewLinks : ((D.unitEvidenceMap||{})[eid] ? [{line:"本单元目标",unitOnly:true}] : []);
}
function getElementEvidences(eid, lk){
  const g = el(eid);
  if(!g || !lk) return { directTargets: [], otherTargets: [], directQualities: [], otherQualities: [] };
  const { u, e } = g;
  const lineName = lk.line;
  const L2 = L[lineName] || {};
  const curXdName = ["", "第一学段", "第二学段", "第三学段"][u.xueduan] || "第三学段";

  const directTargets = [];
  const otherTargets = [];
  const seenKb = {};

  const elemMap = lk.unitOnly ? (D.unitEvidenceMap||{})[eid] : (D.elementEvidenceMap && D.elementEvidenceMap[eid] && D.elementEvidenceMap[eid][lineName]) || null;

  if(elemMap && elemMap.directTargets && elemMap.directTargets.length > 0){
    for(const dt of elemMap.directTargets){
      const k = dt.xd + dt.dom + dt.no;
      if(seenKb[k]) continue;
      seenKb[k] = 1;
      const it = kbCard(dt.xd, dt.dom, dt.no);
      if(it){
        directTargets.push({
          xd: dt.xd, dom: dt.dom, no: dt.no, it: it,
          desc: dt.reason || lk.line,
          reason: dt.reason || lk.line,
          isDirect: true
        });
      }
    }
  } else if(elemMap && elemMap.perElement === true){
    // An audited empty direct list means this item has no direct course-target mapping.
  } else {
    for(const [xd, dom, no] of (L2.kbiao || [])){
      if(xd === curXdName){
        const k = xd + dom + no;
        if(seenKb[k]) continue;
        seenKb[k] = 1;
        const it = kbCard(xd, dom, no);
        if(!it) continue;
        directTargets.push({
          xd: xd, dom: dom, no: no, it: it,
          desc: "【本学段直接目标】" + lk.line,
          reason: "【本学段直接目标】" + lk.line,
          isDirect: true
        });
      }
    }
  }

  if(elemMap && elemMap.perElement === true){
    for(const ot of (elemMap.otherTargets || [])){
      const k = ot.xd + ot.dom + ot.no;
      if(seenKb[k]) continue;
      seenKb[k] = 1;
      const it = kbCard(ot.xd, ot.dom, ot.no);
      if(it) otherTargets.push({xd:ot.xd,dom:ot.dom,no:ot.no,it:it,desc:ot.reason||lk.line,reason:ot.reason||lk.line,isDirect:false});
    }
  } else {
    for(const [xd, dom, no] of (L2.kbiao || [])){
      const k = xd + dom + no;
      if(seenKb[k]) continue;
      seenKb[k] = 1;
      const it = kbCard(xd, dom, no);
      if(!it) continue;
      otherTargets.push({
        xd: xd, dom: dom, no: no, it: it,
        desc: "【其他相关目标】" + lk.line,
        reason: "【其他相关目标】" + lk.line,
        isDirect: false
      });
    }
  }

  let directQualities = [];
  let otherQualities = [];

  if(elemMap && Array.isArray(elemMap.directQualities) && Array.isArray(elemMap.otherQualities)){
    directQualities = elemMap.directQualities.slice();
    otherQualities = elemMap.otherQualities.slice();
  } else if(curXdName !== "第三学段"){
    directQualities = [];
    otherQualities = (L2.quality || []).slice();
  } else {
    if(elemMap && elemMap.directQualities){
      directQualities = (elemMap.directQualities || []).slice();
      otherQualities = (elemMap.otherQualities || []).slice();
    } else {
      if(lineName === "资料运用"){
        directQualities = [];
        otherQualities = [];
      } else {
        directQualities = (L2.quality || []).slice();
        otherQualities = [];
      }
    }
  }

  return { directTargets, otherTargets, directQualities, otherQualities };
}

/* 全部路径视图：按条目合并依据，保留路径归属与关联性质 */
function mergeEvidences(eid, viewLinks){
  const targetMap = new Map(), qualityMap = new Map();
  const push = (map, k, item, lineName, isDirect, fallbackReason)=>{
    const reason = item.reason || item.desc || fallbackReason;
    const ex = map.get(k);
    if(ex){
      if(!ex.paths.includes(lineName)) ex.paths.push(lineName);
      if(!ex.reasons.includes(reason)) ex.reasons.push(reason);
      ex.isDirect = ex.isDirect || isDirect;
      if(!ex.pathRelations.some(r=>r.line===lineName && r.reason===reason && r.isDirect===isDirect)){
        ex.pathRelations.push({line:lineName, reason, isDirect});
      }
    } else {
      map.set(k, Object.assign({}, item, {
        paths:[lineName], reasons:[reason], isDirect,
        pathRelations:[{line:lineName, reason, isDirect}]
      }));
    }
  };
  for(const lk of evidenceLinksOf(eid, viewLinks)){
    const ev = getElementEvidences(eid, lk);
    for(const t of ev.directTargets) push(targetMap, t.xd+t.dom+t.no, t, lk.line, true, "【直接目标】"+lk.line);
    for(const t of ev.otherTargets) push(targetMap, t.xd+t.dom+t.no, t, lk.line, false, "【其他相关目标】"+lk.line);
    for(const q of ev.directQualities) push(qualityMap, q.xueduan+(q.printPage||"")+(q.short||""), q, lk.line, true, "【直接质量参照】"+lk.line);
    for(const q of ev.otherQualities) push(qualityMap, q.xueduan+(q.printPage||"")+(q.short||""), q, lk.line, false, "【综合拓展参照】"+lk.line);
  }
  const targets = [...targetMap.values()], qualities = [...qualityMap.values()];
  return {
    directTargets: targets.filter(x=>x.isDirect),
    otherTargets: targets.filter(x=>!x.isDirect),
    directQualities: qualities.filter(x=>x.isDirect),
    otherQualities: qualities.filter(x=>!x.isDirect)
  };
}

function renderTable(){

  for(const v of vols){
    if(filterVol !== "全部" && filterVol !== v) continue;

    h += '<div class="volhead"><b>'+esc(vs.name0||v)+'</b></div><div class="units">';
    for(const u of us){
      let n = 0;
      let els = "";
      for(const e of u.elements){
        const lk = LINKS[e.eid] || [];
        const linked = lk.length > 0;
        if(linked) n++;
        if(filterState === "有已整理关联" && !linked) continue;
        if(filterState === "未进入现有脉络" && linked) continue;
        const badge = linked ? lk.map(x=>x.line).join(" · ") : getUnlinkedReview(e.eid).label;

               '<span class="no">'+e.seq+'</span>'+esc(e.text)+
               '<span class="badge'+(linked?"":" todo")+'">'+esc(badge)+'</span></button>';

      if(filterState !== "全部" && !els) continue; // 该单元在当前筛选下无可列要素

/* ---- 一侧栏：代表节点规则沿用（key 优先；无 key 时 pre 取末2 / post 取前2） ---- */
function sideColumnHTML(list, kind, viewedLineSet){
  if(!list.length) return '<div class="empty">本侧暂无可列节点。</div>';
  let keys = list.filter(n=>n.key);
  if(!keys.length) keys = (kind === "pre") ? list.slice(-2) : list.slice(0,2);
  else keys = (kind === "pre") ? keys.slice(-2) : keys.slice(0,2);
  const showSet = new Set(keys.map(n=>n.eid));
  let h = "";
  for(const n of list){
    h += nodeCardHTML(n, !showSet.has(n.eid), viewedLineSet);
  }
  const nHidden = list.length - showSet.size;
  if(nHidden > 0){
    h += '<button class="more" data-more>展开其余相关节点（还有 '+nHidden+' 个）</button>';
  }
  return h;
}

/* ---- 课标依据区（学段目标 / 学业质量参照） ---- */
function kbItemHTML(t, opts){
  const o = opts || {};
  const unitOnly = t.paths && t.paths.length === 1 && t.paths[0] === "本单元目标";
  const refLine = esc(t.xd+'　'+t.dom+' 第'+t.no+'条');
  const pathTag = (!unitOnly && t.paths && t.paths.length)
    ? '　<span class="lbl jd">'+esc(t.paths.join("、"))+'</span>' : '';
  const kinds = t.pathRelations
    ? [...new Set(t.pathRelations.map(r=>{const m=(r.reason||"").match(/^【([^】]+)】/); return m?m[1]:"";}).filter(Boolean))]
    : (t.reasons||[]).map(r=>r.replace(/^【|】.*$/g,"").slice(0,6));
  const nature = kinds.length ? '　<span class="lbl">'+esc(kinds.join("／"))+'</span>' : '';
  let fullRows = '<div class="row"><span class="lbl src">课标原文</span>'+esc(t.it.text)+'</div>'+
    '<div class="row"><span class="k">定位：</span>'+esc(t.xd+' '+t.dom+' 第'+t.no+'条　'+kbPageText(t.it))+'</div>';
  if(t.it.note) fullRows += '<div class="row"><span class="k">附注：</span>'+esc(t.it.note)+'</div>';
  if(t.pathRelations && t.pathRelations.length){
    fullRows += '<div class="row"><span class="k">'+(unitOnly?'对应性质：':'路径与关联性质：')+'</span>'+esc(t.pathRelations.map(r=>r.line+'：'+r.reason).join("；"))+'</div>';
  } else if(t.reasons && t.reasons.length){
    fullRows += '<div class="row"><span class="k">关联性质：</span>'+esc(t.reasons.join("；"))+'</div>';
  }
  if(!t.pathRelations && t.paths && t.paths.length){
    fullRows += '<div class="row"><span class="k">关联路径：</span>'+esc(t.paths.join("、"))+'</div>';
  }
  return '<div class="kbitem'+(o.dim?' style="opacity:0.85;margin-top:6px"':'')+'">'+
         '<div class="ref">'+refLine+pathTag+nature+'</div>'+
         '<div class="short"><span class="short-text">'+esc(t.it.short || t.it.text)+'</span>'+ 
         '<details class="kb-details"><summary class="details-summary">查看原文与出处</summary>'+ 
         '<div class="details-body">'+fullRows+'</div></details></div>'+ 
         '</div>';
}

function quItemHTML(q, label, opts){
  const o = opts || {};
  const unitOnly = q.paths && q.paths.length === 1 && q.paths[0] === "本单元目标";
  const pathTag = (!unitOnly && q.paths && q.paths.length)
    ? '　<span class="lbl jd">'+esc(q.paths.join("、"))+'</span>' : '';
  let fullRows = '<div class="row"><span class="lbl src">课标原文</span>'+esc(q.text)+'</div>'+
    '<div class="row"><span class="k">定位：</span>'+esc(q.chapter+'　印刷页 '+q.printPage+'／PDF页 '+q.pdfPage)+'</div>'+
    '<div class="row"><span class="k">要点：</span>'+esc(q.short)+'</div>';

  if(q.pathRelations && q.pathRelations.length) fullRows += '<div class="row"><span class="k">'+(unitOnly?'参照性质：':'路径与参照性质：')+'</span>'+esc(q.pathRelations.map(r=>r.line+'：'+r.reason).join("；"))+'</div>';
  else if(q.paths && q.paths.length) fullRows += '<div class="row"><span class="k">关联路径：</span>'+esc(q.paths.join("、"))+'</div>';
  return '<div class="kbitem'+(o.dim?' style="opacity:0.85;margin-top:6px"':'')+'">'+

         '<div class="short"><span class="short-text"><span class="point-badge">要点·概括</span>'+esc(q.short)+'</span>'+ 
         '<details class="kb-details"><summary class="details-summary">查看原文与出处</summary>'+ 
         '<div class="details-body">'+fullRows+'</div></details></div>'+ 
         '</div>';

function qualityReferenceGroups(qualities, currentStage){
  const stageOrder = {"第一学段":1,"第二学段":2,"第三学段":3};
  const currentOrder = stageOrder[currentStage] || 0;
  const groups = { same:[], later:[], earlier:[] };
  for(const q of qualities || []){
    const order = stageOrder[q.xueduan] || 0;
    if(order === currentOrder) groups.same.push(q);
    else if(order > currentOrder) groups.later.push(q);
    else groups.earlier.push(q);
  }
  return groups;
}

function renderDetail(){

  if(evidenceLinksOf(curEid, viewLinks).length){

             '<div class="side" style="justify-content:center">'+

         for(const n of parts.sameUnit) if(!sameUnitAll.has(n.eid)) sameUnitAll.set(n.eid, {n, lines:[lk.line]});

  h += sameUnitRelationHTML(curEid);

  h += themePanelHTML(u);

  h += '<div class="legend"><b>图例</b>：要素保留教材／教参原文；「关联解读」属于教研判断，不是教材或课标的官方对应；教材先后不等于能力发展阶梯。'+
       '<details style="margin-top:4px"><summary class="details-summary">阅读说明</summary><div class="details-body">'+
       '<div class="row">每侧默认显示 2 个代表性节点（沿用既有代表节点选择规则），完整条目点「展开其余相关节点」或导出 PDF 查看。</div>'+
        '<div class="row">'+esc(SCOPE_NOTE)+'</div>'+ 
       '<div class="row">课标引文页码换算：印刷页码 = PDF 页码 − 3。</div>'+
       '</div></details></div>';

  document.getElementById("detail").innerHTML = h;

  const b = document.getElementById("back"); if(b) b.addEventListener("click", closeDetail);
  document.querySelectorAll("[data-view]").forEach(x=>x.addEventListener("click",()=>{
    curView = x.dataset.view === "all" ? "all" : parseInt(x.dataset.view,10);
    renderDetail();
  }));
  document.querySelectorAll("[data-theme-toggle]").forEach(x=>x.addEventListener("click",()=>{
    themePanelOpen = !themePanelOpen;
    renderDetail();
  }));
  document.querySelectorAll("#detail [data-theme-eid]").forEach(x=>x.addEventListener("click",()=>openElement(x.dataset.themeEid)));
  document.querySelectorAll("#detail [data-strategy-eid]").forEach(x=>x.addEventListener("click",()=>openElement(x.dataset.strategyEid)));
  document.querySelectorAll("#detail [data-same-unit-eid]").forEach(x=>x.addEventListener("click",()=>openElement(x.dataset.sameUnitEid)));
  document.querySelectorAll("[data-details-toggle]").forEach(x=>x.addEventListener("click",()=>{
    const panel = x.closest(".node, .center").querySelector(".toggle-details-body");
    panel.hidden = !panel.hidden;
    x.setAttribute("aria-expanded", String(!panel.hidden));
  }));
  document.querySelectorAll("[data-more]").forEach(x=>x.addEventListener("click",()=>{
    x.parentElement.querySelectorAll("[data-hidden]").forEach(y=>{
      y.style.display = "block";
      y.removeAttribute("data-hidden");
    });
    x.remove();
  }));

  // 导出菜单
  const dd = document.getElementById("exp-dd");
  document.getElementById("exp-btn").addEventListener("click", ev=>{
    ev.stopPropagation();
    dd.classList.toggle("show");
  });
  document.addEventListener("click", function closeDD(){
    dd.classList.remove("show");
  });
  dd.querySelectorAll(".exp-item").forEach(x=>x.addEventListener("click", ()=>{
    dd.classList.remove("show");
    const kind = x.dataset.exp;
    if(kind === "md") exportMarkdown();
    else if(kind === "mindmap") exportMindmapPNG();

    else if(kind === "pdf") exportPDF();

}

/* 严格按真实教材时间划分此前 / 同单元 / 此后 */
function splitNodes(arr, curUid, curEid){
  const curOrder = nodeOrderKey(curEid);
  const pre = [], post = [], sameUnit = [];
  for(const n of arr){
    if(n.eid === curEid) continue;
    const nOrder = nodeOrderKey(n.eid);
    const nUid = n.eid.slice(0, n.eid.lastIndexOf("-"));
    if(nUid === curUid) sameUnit.push(n);
    else if(nOrder < curOrder) pre.push(n);
    else post.push(n);
  }
  return {pre, post, sameUnit};
}
function shownCount(list){
  let keys = list.filter(n=>n.key);
  if(!keys.length) keys = list.slice(0,2);
  return Math.min(keys.length, 2);
}

      if(ev.otherTargets.length > 0){
        o.push("#### 其他相关目标参照", "");
        for(const t of ev.otherTargets){
          o.push("- **"+t.xd+"　"+t.dom+" 第"+t.no+"条**（" + kbPageText(t.it) + "）",
                 "  - **关联性质**："+t.reason,

    "> 4. **排列顺序说明**：排列顺序说明教材编排次序，不表示能力发展的先后阶梯。");

  const blob = new Blob([o.join(String.fromCharCode(10))], {type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "要素脉络_"+curEid+".md";
