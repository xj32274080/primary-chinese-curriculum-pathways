<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>课标统领的教材脉络图 · 单元要素版</title>
<style>
:root{
  --bd:#ded8cc;--bd2:#c9bea9;--txt:#1f211c;--muted:#6f6a5f;--bg:#f6f2ea;--card:#fffdf8;
  --accent:#2f5d50;--accent2:#b9653b;--kbbg:#eef4f1;--kbbd:#bcd3ca;--qubg:#fdf4e8;--qubd:#e6c9a3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6}
.wrap{max-width:1400px;margin:0 auto;padding:14px 16px 60px}
/* ---------- 顶栏 ---------- */
.top{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 15px;
  position:sticky;top:6px;z-index:30;box-shadow:0 10px 26px rgba(55,48,35,.07)}
.t1{font-size:19px;font-weight:800}
.t2{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.65}
.tools{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--bd);background:#fff;color:var(--txt);font:inherit;font-size:13px;
  padding:6px 12px;border-radius:999px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.spacer{flex:1 1 auto}
/* ---------- 第一层：全表 ---------- */
.volhead{display:flex;align-items:baseline;gap:10px;margin:20px 2px 9px;flex-wrap:wrap;
  padding-bottom:6px;border-bottom:2px solid var(--bd2)}
.volhead b{font-size:16px}
.volhead span{font-size:11.5px;color:var(--muted)}
.volhead .tagv{border:1px solid var(--bd2);border-radius:5px;padding:1px 7px;font-size:11px;background:#fff}
.volhead .tagv.ok{background:var(--accent);color:#fff;border-color:var(--accent)}
.volhead .tagv.todo{background:var(--qubg);color:var(--accent2);border-color:var(--qubd)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:11px}
.unit{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.unit h4{margin:0 0 3px;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.unit h4 span{font-size:11px;color:var(--muted);font-weight:400}
.unit .theme{font-size:12px;color:var(--accent2);margin-bottom:7px;line-height:1.5}
.el{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:#fff;
  border-radius:9px;padding:7px 9px;margin-bottom:6px;font:inherit;font-size:13px;cursor:pointer;
  line-height:1.55;position:relative;padding-left:30px}
.el:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(47,93,80,.10)}
.el .no{position:absolute;left:8px;top:7px;width:15px;height:15px;border-radius:50%;
  background:var(--bd2);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.el.linked .no{background:var(--accent)}
.el .badge{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:4px;margin-left:5px;
  border:1px solid var(--bd2);background:#fff;color:var(--muted);vertical-align:1px}
.el.linked .badge{background:var(--kbbg);color:var(--accent);border-color:var(--kbbd)}
.el .badge.todo{background:var(--qubg);color:var(--accent2);border-color:var(--qubd)}
/* ---------- 第二层：脉络图 ---------- */
#detail{display:none}
.crumb{font-size:13px;color:var(--muted);margin:14px 2px 10px}
.crumb button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;
  text-decoration:underline;padding:0}
.kbzone{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px 14px;margin-bottom:12px}
.kbzone h3{margin:0 0 8px;font-size:14px}
.kbtabs{display:flex;gap:7px;margin-bottom:9px}
.kbcol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:860px){.kbcol{grid-template-columns:1fr}}
.kbitem{border:1px solid var(--kbbd);background:var(--kbbg);border-radius:10px;padding:9px 11px;
  font-size:13px;line-height:1.7;cursor:pointer}
.kbitem .ref{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:3px}
.kbitem .short{color:var(--txt)}
.kbitem .full{display:none;margin-top:7px;padding-top:7px;border-top:1px dashed var(--kbbd)}
.kbitem.open .full{display:block}
.kbitem .lbl{font-size:10.5px;color:var(--accent2);border:1px solid var(--qubd);background:var(--qubg);
  border-radius:4px;padding:0 5px;margin-right:5px}
.pathtabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 2px 10px}
.pathnote{font-size:12px;color:var(--muted);margin:0 2px 12px}
.board{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:12px;align-items:start}
@media(max-width:1000px){.board{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:9px}
.sideh{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px;padding:0 4px}
.node{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:9px 11px;cursor:pointer}
.node:hover{border-color:var(--accent)}
.node .nh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:3px}
.node .nh b{font-size:13px;color:var(--accent)}
.node .nh span{font-size:11px;color:var(--muted)}
.node .sum{font-size:12.5px;color:var(--txt);line-height:1.55}
.node .sum i{font-style:normal;font-size:10.5px;color:var(--accent2);border:1px solid var(--qubd);
  background:var(--qubg);border-radius:4px;padding:0 5px;margin-right:5px}
.node .full{display:none;margin-top:7px;padding-top:7px;border-top:1px dashed var(--bd2);font-size:12.5px}
.node.open .full{display:block}
.node .full .row{margin-bottom:5px}
.node .full .k{color:var(--muted);font-size:11px}
.more{border:1px dashed var(--bd2);background:#fff;color:var(--muted);font:inherit;font-size:12px;
  padding:6px;border-radius:9px;cursor:pointer;width:100%}
.center{background:linear-gradient(180deg,#fffdf8,#f3f8f5);border:2px solid var(--accent);
  border-radius:14px;padding:14px 16px}
.center .ch{font-size:12px;color:var(--muted);margin-bottom:6px}
.center .ct{font-size:18px;line-height:1.65;font-weight:600;margin-bottom:9px}
.center .cm{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.center .cnote{font-size:12px;color:var(--accent2);margin-top:9px;padding-top:8px;
  border-top:1px dashed var(--bd2)}
.arrowrow{display:flex;justify-content:space-between;color:var(--bd2);font-size:20px;padding:0 6px}
.lbl2{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:4px;margin-right:5px;
  border:1px solid var(--bd2);background:#fff;color:var(--muted)}
.lbl2.src{background:var(--kbbg);color:var(--accent);border-color:var(--kbbd)}
.lbl2.jd{background:var(--qubg);color:var(--accent2);border-color:var(--qubd)}
.lbl2.todo{background:#fff;color:var(--accent2);border-color:var(--qubd)}
.legend{font-size:12px;color:var(--muted);margin:10px 2px;line-height:1.8}
.empty{background:var(--card);border:1px dashed var(--bd2);border-radius:11px;padding:14px;
  font-size:13px;color:var(--muted);line-height:1.7}
.foot{font-size:11.5px;color:var(--muted);margin-top:26px;line-height:1.8;
  border-top:1px solid var(--bd);padding-top:12px}

.unit .theme { font-size: 12px; color: var(--accent2); margin-bottom: 7px; line-height: 1.5; font-weight: 500; }
.center .theme-tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--qubg); color: var(--accent2); border: 1px solid var(--qubd); margin-left: 6px; }
.source-tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #eef4f1; color: var(--accent); border: 1px solid var(--kbbd); }
.same-unit-box { background: #fffcf5; border: 1px dashed var(--qubd); border-radius: 9px; padding: 8px 10px; margin-bottom: 9px; font-size: 12.5px; }

@media(max-width: 900px){
  #detail { display: flex; flex-direction: column; }
  #detail .crumb { order: 1; }
  #detail .center { order: 2; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(47,93,80,.12); }
  #detail .pathtabs { order: 3; }
  #detail .pathnote { order: 4; }
  #detail .kbzone { order: 5; margin-bottom: 12px; }
  #detail .board { order: 6; display: flex; flex-direction: column; }
  #detail .board .side.pre-side { order: 1; }
  #detail .board .center { display: none; } /* 窄屏已在顶部显示 */
  #detail .board .side.post-side { order: 2; }
  #detail .legend { order: 7; }
}


.unit .theme { font-size: 12px; color: var(--accent2); margin-bottom: 7px; line-height: 1.5; font-weight: 500; }
.center .theme-tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--qubg); color: var(--accent2); border: 1px solid var(--qubd); margin-left: 6px; }
.source-tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #eef4f1; color: var(--accent); border: 1px solid var(--kbbd); }
.same-unit-box { background: #fffcf5; border: 1px dashed var(--qubd); border-radius: 9px; padding: 8px 10px; margin-bottom: 9px; font-size: 12.5px; }

.center-mobile { display: none; }
.center-desktop { display: block; }

@media(max-width: 900px){
  .center-mobile { display: block; margin-bottom: 12px; }
  .center-desktop { display: none; }
  .board { display: flex; flex-direction: column; gap: 12px; }
}

</style>
</head>

me": "二年级下册", "unit": "八", "xueduan": 1, "page": 100, "theme": "远古传说", "quote": "", "人文主题": "远古传说", "elements": [{"eid": "二下-八-1", "seq": 1, "text": "按照事情的发展过程讲故事", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}]}, "三上-一": {"id": "三上-一", "vol": "三上", "volName": "三年级上册", "unit": "一", "xueduan": 2, "page": 1, "theme": "寻访多彩校园，留下欢乐印迹。", "quote": "", "引语": "美丽的校园，成长的摇篮，梦想启航的地方。", "人文主题": "寻访多彩校园，留下欢乐印迹。", "elements": [{"eid": "三上-一-1", "seq": 1, "text": "阅读时，关注有新鲜感的词语和句子。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三上-一-2", "seq": 2, "text": "体会习作的乐趣。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三上-二": {"id": "三上-二", "vol": "三上", "volName": "三年级上册", "unit": "二", "xueduan": 2, "page": 13, "theme": "感受金秋时节的自然之美。", "quote": "", "引语": "金秋的阳光，洒在树叶上，洒在花瓣上，也洒在我们的心上。", "人文主题": "感受金秋时节的自然之美。", "elements": [{"eid": "三上-二-1", "seq": 1, "text": "运用多种方法理解难懂的词语。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三上-二-2", "seq": 2, "text": "学习写日记，记录自己的见闻、感受。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三上-三": {"id": "三上-三", "vol": "三上", "volName": "三年级上册", "unit": "三", "xueduan": 2, "page": 27, "theme": "猜测与推想，使我们的阅读之旅充满了乐趣。", "quote": "", "人文主题": "猜测与推想，使我们的阅读之旅充满了乐趣。", "elements": [{"eid": "三上-三-1", "seq": 1, "text": "了解预测的基本方法并尝试运用。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三上-三-2", "seq": 2, "text": "尝试续编故事。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三上-四": {"id": "三上-四", "vol": "三上", "volName": "三年级上册", "unit": "四", "xueduan": 2, "page": 45, "theme": "阅读童话，构筑充满童心的精神乐园。", "quote": "", "引语": "乘着想象的翅膀，游历奇妙的童话王国，看花儿跳舞，听星星歌唱。", "人文主题": "阅读童话，构筑充满童心的精神乐园。", "elements": [{"eid": "三上-四-1", "seq": 1, "text": "感受童话丰富的想象，体会其中的真善美。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三上-四-2", "seq": 2, "text": "试着自己编童话、写童话。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三上-五": {"id": "三上-五", "vol": "三上", "volName": "三年级上册", "unit": "五", "xueduan": 2, "page": 59, "theme": "生活中不缺少美，只是缺少发现美的眼睛。—— [法国] 罗丹", "quote": "", "人文主题": "生活中不缺少美，只是缺少发现美的眼睛。—— [法国] 罗丹", "elements": [{"eid": "三上-五-1", "seq": 1, "text": "体会作者是怎样留心观察周围事物的。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三上-五-2", "seq": 2, "text": "仔细观察，把观察所得写下来。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三上-六": {"id": "三上-六", "vol": "三上", "volName": "三年级上册", "unit": "六", "xueduan": 2, "page": 69, "theme": "饱览大好河山，感受祖国之美。", "quote": "", "引语": "祖国，我爱你。我爱你壮美的山河，我爱你每一寸土地。", "人文主题": "饱览大好河山，感受祖国之美。", "elements": [{"eid": "三上-六-1", "seq": 1, "text": "借助关键语句理解一段话的意思。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三上-六-2", "seq": 2, "text": "学习围绕一个意思把一段话写清楚。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三上-七": {"id": "三上-七", "vol": "三上", "volName": "三年级上册", "unit": "七", "xueduan": 2, "page": 83, "theme": "探索自然，发现生命之美。", "quote": "", "引语": "大自然赐给我们许多珍贵的礼物，你发现了吗？", "人文主题": "探索自然，发现生命之美。", "elements": [{"eid": "三上-七-1", "seq": 1, "text": "感受课文生动的语言，积累喜欢的语句。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三上-七-2", "seq": 2, "text": "留心生活，把自己的想法记录下来。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三上-八": {"id": "三上-八", "vol": "三上", "volName": "三年级上册", "unit": "八", "xueduan": 2, "page": 95, "theme": "感悟美好品质，获取精神力量。", "quote": "", "引语": "美好的品质，犹如温暖的阳光，带给我们希望和力量。", "人文主题": "感悟美好品质，获取精神力量。", "elements": [{"eid": "三上-八-1", "seq": 1, "text": "学习带着问题默读，理解课文内容。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三上-八-2", "seq": 2, "text": "学写一件简单的事。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三下-一": {"id": "三下-一", "vol": "三下", "volName": "三年级下册", "unit": "一", "xueduan": 2, "page": 1, "theme": "亲近动物植物，热爱自然与生命。", "quote": "", "引语": "鸟儿在空中翱翔，蝴蝶在花间嬉戏……大自然中，处处有可爱的生灵。", "人文主题": "亲近动物植物，热爱自然与生命。", "elements": [{"eid": "三下-一-1", "seq": 1, "text": "试着一边读一边想象画面；体会优美生动的语句。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三下-一-2", "seq": 2, "text": "试着把观察到的事物写清楚。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三下-二": {"id": "三下-二", "vol": "三下", "volName": "三年级下册", "unit": "二", "xueduan": 2, "page": 15, "theme": "从寓言中获得人生启示。", "quote": "", "引语": "寓言是生活的一面镜子。", "人文主题": "从寓言中获得人生启示。", "elements": [{"eid": "三下-二-1", "seq": 1, "text": "读故事，明白其中的道理。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三下-二-2", "seq": 2, "text": "把图画的内容写清楚。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三下-三": {"id": "三下-三", "vol": "三下", "volName": "三年级下册", "unit": "三", "xueduan": 2, "page": 33, "theme": "观察自然，探索世界。", "quote": "", "引语": "看，花儿在悄悄绽放；听，虫儿在窃窃私语……自然界如此奇妙，留心观察，会有新的发现。", "人文主题": "观察自然，探索世界。", "elements": [{"eid": "三下-三-1", "seq": 1, "text": "借助关键语句概括一段话的大意。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三下-三-2", "seq": 2, "text": "做个小实验，把实验过程写清楚。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三下-四": {"id": "三下-四", "vol": "三下", "volName": "三年级下册", "unit": "四", "xueduan": 2, "page": 43, "theme": "感受古人智慧，领略中华文化的魅力。", "quote": "", "引语": "中华优秀传统文化，是中华民族的根和魂。", "人文主题": "感受古人智慧，领略中华文化的魅力。", "elements": [{"eid": "三下-四-1", "seq": 1, "text": "了解课文是怎么围绕一个意思把一段话写清楚的。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三下-四-2", "seq": 2, "text": "收集传统节日的资料，交流节日的风俗习惯，写一写过节的情景。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三下-五": {"id": "三下-五", "vol": "三下", "volName": "三年级下册", "unit": "五", "xueduan": 2, "page": 57, "theme": "想象力比知识更重要。—— [美国] 爱因斯坦", "quote": "", "人文主题": "想象力比知识更重要。—— [美国] 爱因斯坦", "elements": [{"eid": "三下-五-1", "seq": 1, "text": "在阅读中感受想象的神奇。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三下-五-2", "seq": 2, "text": "发挥想象写故事。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三下-六": {"id": "三下-六", "vol": "三下", "volName": "三年级下册", "unit": "六", "xueduan": 2, "page": 69, "theme": "品味多彩童年，感受美好的童心。", "quote": "", "引语": "在童年的百花园里，我们看到了真善美。", "人文主题": "品味多彩童年，感受美好的童心。", "elements": [{"eid": "三下-六-1", "seq": 1, "text": "运用多种方法理解难懂的句子。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三下-六-2", "seq": 2, "text": "写一个身边的人，尝试写出这个人的特点。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三下-七": {"id": "三下-七", "vol": "三下", "volName": "三年级下册", "unit": "七", "xueduan": 2, "page": 83, "theme": "发现世界之美，领略大自然的奇妙。", "quote": "", "引语": "天地间隐藏着无穷无尽的奥秘，等待我们去发现。", "人文主题": "发现世界之美，领略大自然的奇妙。", "elements": [{"eid": "三下-七-1", "seq": 1, "text": "阅读写景的文章，了解所描写景物的特点。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三下-七-2", "seq": 2, "text": "初步学习整合信息，介绍一种事物。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "三下-八": {"id": "三下-八", "vol": "三下", "volName": "三年级下册", "unit": "八", "xueduan": 2, "page": 95, "theme": "走进趣味故事，增长生活智慧。", "quote": "", "引语": "有趣的故事，留下的不仅是开心的笑声，还有许多的思考。", "人文主题": "走进趣味故事，增长生活智慧。", "elements": [{"eid": "三下-八-1", "seq": 1, "text": "了解故事的主要内容，复述故事。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "三下-八-2", "seq": 2, "text": "根据提示，展开想象，尝试编童话故事。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "四上-一": {"id": "四上-一", "vol": "四上", "volName": "四年级上册", "unit": "一", "xueduan": 2, "page": 1, "theme": "感受美丽风光，体会自然之美。", "quote": "", "引语": "江流天地外，山色有无中。—— [唐] 王维", "人文主题": "感受美丽风光，体会自然之美。", "elements": [{"eid": "四上-一-1", "seq": 1, "text": "边读边想象画面，加深对课文内容的理解。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "四上-一-2", "seq": 2, "text": "推荐一个好地方，写清楚推荐理由。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "四上-二": {"id": "四上-二", "vol": "四上", "volName": "四年级上册", "unit": "二", "xueduan": 2, "page": 13, "theme": "为学患无疑，疑则有进。—— [宋] 陆九渊", "quote": "", "人文主题": "为学患无疑，疑则有进。—— [宋] 陆九渊", "elements": [{"eid": "四上-二-1", "seq": 1, "text": "阅读时尝试从不同角度思考，提出自己的问题。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "四上-二-2", "seq": 2, "text": "写一个人，注意把印象最深的地方写出来。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "四上-三": {"id": "四上-三", "vol": "四上", "volName": "四年级上册", "unit": "三", "xueduan": 2, "page": 33, "theme": "用心观察，发现自然的秘密。", "quote": "", "引语": "处处留心皆学问。", "人文主题": "用心观察，发现自然的秘密。", "elements": [{"eid": "四上-三-1", "seq": 1, "text": "体会文章准确生动的表达，感受作者连续细致的观察。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "四上-三-2", "seq": 2, "text": "进行连续观察，学写观察日记。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "四上-四": {"id": "四上-四", "vol": "四上", "volName": "四年级上册", "unit": "四", "xueduan": 2, "page": 47, "theme": "走进古人的想象世界，感受神话的神奇。", "quote": "", "引语": "神话，永久的魅力，人类童年时代飞腾的幻想。", "人文主题": "走进古人的想象世界，感受神话的神奇。", "elements": [{"eid": "四上-四-1", "seq": 1, "text": "了解故事的起因、经过、结果，学习把握文章的主要内容；感受神话中鲜明的人物形象。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "四上-四-2", "seq": 2, "text": "展开想象，写一个故事。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "四上-五": {"id": "四上-五", "vol": "四上", "volName": "四年级上册", "unit": "五", "xueduan": 2, "page": 61, "theme": "我手写我心，彩笔绘生活。", "quote": "", "人文主题": "我手写我心，彩笔绘生活。", "elements": [{"eid": "四上-五-1", "seq": 1, "text": "了解作者是怎样把事情写清楚的。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "四上-五-2", "seq": 2, "text": "写一件事，把事情写清楚。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "四上-六": {"id": "四上-六", "vol": "四上", "volName": "四年级上册", "unit": "六", "xueduan": 2, "page": 73, "theme": "了解中国的世界文化遗产，加深对中华文明的理解。", "quote": "", "引语": "中国文化源远流长，中华文明博大精深。——习近平", "人文主题": "了解中国的世界文化遗产，加深对中华文明的理解。", "elements": [{"eid": "四上-六-1", "seq": 1, "text": "借助关键语句，把握文章的主要内容。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "四上-六-2", "seq": 2, "text": "收集、整理资料，尝试介绍一项中国的世界文化遗产。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "四上-七": {"id": "四上-七", "vol": "四上", "volName": "四年级上册", "unit": "七", "xueduan": 2, "page": 87, "theme": "品读儿童故事，体味成长中的酸甜苦辣。", "quote": "", "引语": "童年啊！是梦中的真，是真中的梦，是回忆时含泪的微笑。——冰心", "人文主题": "品读儿童故事，体味成长中的酸甜苦辣。", "elements": [{"eid": "四上-七-1", "seq": 1, "text": "一边读一边作批注，加深对文章的理解。", "orient": "阅读取向", "orientNote": "教研判断，非教材官方分类"}, {"eid": "四上-七-2", "seq": 2, "text": "写一件事，注意写出自己的感受。", "orient": "表达取向", "orientNote": "教研判断，非教材官方分类"}]}, "四上-八": {"id": "四上-八", "vol": "四上", "volName": "四年级上册", "unit": "八", "xueduan": 2, "page": 107, "theme": "读古今诗文，感受赤心报国的情怀。", "quote": "", "引语": "天下兴亡，匹夫有责。", "人文主题": "读古今诗文，感受赤心报国的情怀。", "elements" otal": 7, "prev": null, "next": "四上-五-2", "link": "组织单位为一段话，要求围绕一个意思。"}], "四上-五-2": [{"line": "表达组织", "index": 1, "total": 7, "prev": "三上-六-2", "next": "四下-六-2", "link": "组织单位为一件事，仍以写清楚为目标。"}], "四下-六-2": [{"line": "表达组织", "index": 2, "total": 7, "prev": "四上-五-2", "next": "五上-四-2", "link": "增加“按一定顺序”这一组织手段。"}], "五上-四-2": [{"line": "表达组织", "index": 3, "total": 7, "prev": "四下-六-2", "next": "五上-八-2", "link": "要求落到落笔之前的思路组织（列提纲）。"}], "五上-八-2": [{"line": "表达组织", "index": 4, "total": 7, "prev": "五上-四-2", "next": "六上-五-2", "link": "要求分段表述并突出重点，由表达需要决定。"}], "六上-五-2": [{"line": "表达组织", "index": 5, "total": 7, "prev": "五上-八-2", "next": "六下-一-2", "link": "选材围绕中心意思，先定中心再选材料。"}], "六下-一-2": [{"line": "表达组织", "index": 6, "total": 7, "prev": "六上-五-2", "next": null, "link": "要求抓住重点、写出特点。"}]}, "versions": {"一上": {"state": "低年级·教参来源", "detail": "课本不设导语页，要素取自教师教学用书「单元说明」；教参页码待补"}, "一下": {"state": "低年级·教参来源", "detail": "同上；部分单元经 OCR 交叉验证"}, "二上": {"state": "低年级·教参来源", "detail": "同上"}, "二下": {"state": "低年级·教参来源", "detail": "同上；依据教参前言的全册要素列表"}, "三上": {"state": "已核", "detail": "导语页逐页提取，本机 PDF"}, "三下": {"state": "已核", "detail": "同上"}, "四上": {"state": "已核", "detail": "同上"}, "四下": {"state": "已核·统编旧版", "detail": "经核定为教育部统编语文教材旧版；本轮已核第一、第三单元导语页原文"}, "五上": {"state": "已核", "detail": "本轮已回原 PDF 逐条核对第一、第四、第六、第八单元"}, "五下": {"state": "已核·统编旧版", "detail": "经核定为教育部统编语文教材旧版；全册导语页逐页提取结果已核验"}, "六上": {"state": "已核", "detail": "本轮已回原 PDF 核对第八单元"}, "六下": {"state": "已核·统编旧版", "detail": "经核定为教育部统编语文教材旧版；本轮已回原 PDF 核对第三单元导语页原文"}}, "kbiao": {"第一学段": {"grades": "1～2年级", "print_page": 7, "domains": {"识字与写字": [{"no": 1, "text": "喜欢学习汉字，有主动识字、写字的愿望。认识常用汉字1600个左右，其中800个左右会写。", "page": 7, "short": "喜欢学习汉字，有主动识字、写字的愿望，认识常用汉字1600个左右"}, {"no": 2, "text": "学会汉语拼音。能读准声母、韵母、声调和整体认读音节。能准确地拼读音节，正确书写声母、韵母和音节。认识大写字母，熟记《汉语拼音字母表》。", "page": 7, "short": "掌握汉字基本笔画和常用偏旁部首，按笔顺规则写字，注意间架结构"}, {"no": 3, "text": "掌握汉字的基本笔画和常用的偏旁部首，能按基本的笔顺规则用硬笔写字，注意间架结构，初步感受汉字的形体美。努力养成良好的写字习惯，写字姿势正确，书写规范、端正、整洁。", "page": 7, "short": "学习独立识字，能借助汉语拼音认读汉字，学会用音序检字法和部首检字法查字典"}, {"no": 4, "text": "学习独立识字。能借助汉语拼音认读汉字，学会用音序检字法和部首检字法查字典。", "page": 7, "short": "学习独立识字"}], "阅读与鉴赏": [{"no": 1, "text": "喜欢阅读，感受阅读的乐趣。学习用普通话正确、流利、有感情地朗读课文。学习默读。", "page": 7, "short": "学习用普通话正确、流利、有感情地朗读课文；学习默读"}, {"no": 2, "text": "结合上下文和生活实际了解课文中词句的意思，在阅读中积累词语。认识课文中出现的常用标点符号，在阅读中体会句号、问号、感叹号所表达的不同语气。借助读物中的图画阅读。", "page": 8, "short": "结合上下文和生活实际了解课文中词句的意思，在阅读中积累词语"}, {"no": 3, "text": "阅读浅近的童话、寓言、故事，向往美好的情境，关心自然和生命，对感兴趣的人物和事件有自己的感受和想法，并乐于与他人交流。诵读儿歌、儿童诗和浅近的古诗，展开想象，获得初步的情感体验，感受语言的优美。", "page": 8, "short": "阅读浅近的童话、寓言、故事，向往美好的情境，关心自然和生命"}, {"no": 4, "text": "尝试阅读整本书，用自己喜欢的方式向他人介绍读过的书。养成爱护图书的习惯。", "page": 8, "short": "诵读儿歌、儿童诗和浅近的古诗，展开想象，获得初步的情感体验"}, {"no": 5, "text": "积累自己喜欢的成语和格言警句。背诵优秀诗文50篇(段)。课外阅读总量不少于5万字。", "page": 8, "short": "积累自己喜欢的成语和格言警句"}], "表达与交流": [{"no": 1, "text": "学说普通话，逐步养成说普通话的习惯，有表达交流的自信心。", "page": 8, "short": "学说普通话，逐步养成说普通话的习惯；能认真听别人讲话，努力了解主要内容"}, {"no": 2, "text": "能认真听他人讲话，努力了解讲话的主要内容。听故事、看影视作品，能复述大意和自己感兴趣的情节。能较完整地讲述小故事，能简要讲述自己感兴趣的见闻。与他人交谈，态度自然大方，有礼貌。积极参加讨论，敢于发表自己的意见。", "page": 8, "short": "听故事、看音像作品，能复述大意和精彩情节；能较完整地讲述小故事"}, {"no": 3, "text": "对写话有兴趣，留心周围事物，写自己想说的话，写想象中的事物。在写话中乐于运用阅读和生活中学到的词语。", "page": 8, "short": "与人交谈，态度自然大方，有礼貌；有表达的自信心，积极参加讨论"}, {"no": 4, "text": "根据表达的需要，学习使用逗号、句号、问号、感叹号。", "page": 8, "short": "对写话有兴趣，留心周围事物，写自己想说的话，写想象中的事物"}], "梳理与探究": [{"no": 1, "text": "观察字形，体会汉字部件之间的关系。梳理学过的字，感知汉字与生活的联系。", "page": 8, "short": "观察字形，体会汉字部件之间的关系；梳理学过的字，感知汉字与生活的联系"}, {"no": 2, "text": "观察大自然，热心参加校园、社区活动，积累活动体验。结合语文学习，用口头或图文等方式整理、表达自己在活动中的见闻和想法。", "page": 8, "short": "观察大自然，热心参加校园、社区活动，积累活动体验，整理表达见闻和想法"}, {"no": 3, "text": "对周围事物有好奇心，能就感兴趣的内容提出问题，结合其他学科的学习和生活经验交流讨论，尝试提出自己的看法。", "page": 9, "note": "【学段收束说明】在落实以上要求过程中，注重引导学生关注中华优秀传统文化在日常生活中的表现，初步感受中华优秀传统文化的重要价值；初步懂得幸福生活是革命前辈浴血奋战、艰苦奋斗换来的，激发对革命领袖、革命家、英雄人物的崇敬之情；关注当代社会新面貌，感受当代社会的新变化。（印刷第9页）", "short": "对周围事物有好奇心，能提出问题并交流讨论，尝试提出自己的看法"}]}}, "第二学段": {"grades": "3～4年级", "print_page": 9, "domains": {"识字与写字": [{"no": 1, "text": "对学习汉字有浓厚的兴趣，养成主动识字的习惯。累计认识常用汉字2500个左右，其中1600个左右会写。有初步的独立识字能力。能用音序检字法和部首检字法查字典、词典。", "page": 9, "short": "对学习汉字有浓厚的兴趣，养成主动识字的习惯"}, {"no": 2, "text": "写字姿势正确，养成良好的书写习惯。能用硬笔熟练地书写正楷字，做到规范、端正、整洁。用毛笔临摹正楷字帖，感受汉字的书写特点和形体美。", "page": 9, "short": "写字姿势正确，养成良好的书写习惯"}, {"no": 3, "text": "能感知常用汉字形、音、义之间的联系，初步建立汉字与生活中事物、行为的联系，初步感受汉字的文化内涵。", "page": 9, "short": "能感知常用汉字形、音、义之间的联系，初步建立汉字与生活中事物、行为的联系，初步感受汉字的文化内涵"}], "阅读与鉴赏": [{"no": 1, "text": "用普通话正确、流利、有感情地朗读课文。初步学会默读，做到不出声，不指读。学习略读，粗知文章大意。", "page": 9, "short": "用普通话正确、流利、有感情地朗读课文；初步学会默读，学习略读"}, {"no": 2, "text": "能联系上下文，理解词句的意思，体会课文中关键词句表达情意的作用。能借助字典、词典和生活积累，理解生词的意义。在理解语句的过程中，体会句号与逗号的不同用法，了解冒号、引号的一般用法。", "page": 9, "short": "能联系上下文，理解词句的意思，体会课文中关键词句表达情意的作用"}, {"no": 3, "text": "能初步把握文章的主要内容，体会文章表达的思想感情。学习圈点、批注等阅读方法。能对课文中不理解的地方提出疑问，乐于与他人讨论交流。", "page": 10, "short": "初步把握文章的主要内容，体会文章表达的思想感情；初步感受作品中生动的形象"}, {"no": 4, "text": "能复述叙事性作品的大意，初步感受作品中生动的形象和优美的语言，关心作品中人物的命运和喜怒哀乐，与他人交流自己的阅读感受。诵读优秀诗文，注意在诵读过程中体验情感，展开想象，领悟诗文大意。", "page": 10, "short": "复述叙事性作品的大意，初步感受生动的形象和优美的语言，关心人物命运"}, {"no": 5, "text": "阅读整本书，初步理解主要内容，主动和同学分享自己的阅读感受。", "page": 10, "short": "阅读整本书，初步理解主要内容，主动和同学分享自己的阅读感受"}, {"no": 6, "text": "积累课文中的优美词语、精彩句段，以及在课外阅读和生活中获得的语言材料。背诵优秀诗文50篇(段)。养成读书看报的习惯，收藏图书资料，乐于与同学交流。课外阅读总量不少于40万字。", "page": 10, "short": "积累课文中的优美词语、精彩句段，以及在课外阅读和生活中获得的语言材料"}], "表达与交流": [{"no": 1, "text": "乐于用口头、书面的方式与人交流沟通，愿意与他人分享，增强表达的自信心。", "page": 10, "short": "乐于用口头、书面的方式与人交流沟通，愿意与他人分享，增强表达的自信心"}, {"no": 2, "text": "能用普通话交谈，学会认真倾听，听人说话时能把握主要内容，并能简要转述。能就不理解的地方向人请教，就不同的意见与人商讨。", "page": 10, "short": "能用普通话交谈，学会认真倾听，听人说话时能把握主要内容，并能简要转述"}, {"no": 3, "text": "能清楚明白地讲述见闻，说出自己的感受和想法。讲述故事力求具体生动。能主动参与日常生活中的文化活动，根据不同的场合，尝试运用合适的音量和语气与他人交流，有礼貌地请教、回应。", "page": 10, "short": "能清楚明白地讲述见闻，说出自己的感受和想法"}, {"no": 4, "text": "观察周围世界，能不拘形式地写下自己的见闻、感受和想象，注意把自己觉得新奇有趣或印象最深、最受感动的内容写清楚。能用便条、简短的书信等进行交流。尝试在习作中运用自己平时积累的语言材料，特别是有新鲜感的词句。", "page": 10, "short": "观察周围世界，能不拘形式地写下见闻、感受和想象，把新奇有趣或印象最深的内容写清楚"}, {"no": 5, "text": "学习修改习作中有明显错误的词句。根据表达的需要，正确使用冒号、引号等标点符号。课内习作每学年16次左右。", "page": 11, "short": "学习修改习作中有明显错误的词句"}], "梳理与探究": [{"no": 1, "text": "尝试分类整理学过的字词。尝试发现所学汉字形、音、义和书写的特点，帮助自己识字、写字。", "page": 11, "short": "尝试分类整理学过的字词"}, {"no": 2, "text": "学习组织有趣味的语文实践活动，在活动中学习语文，学会合作。结合语文学习，观察大自然，观察社会，积极思考，运用书面或口头方式，并可尝试用表格、图像、音频等多种媒介，呈现自己的观察与探究所得。", "page": 11, "short": "学习组织有趣味的语文实践活动，在活动中学习语文，学会合作"}, {"no": 3, "text": "能提出学习和生活中的问题，有目的地搜集资料，共同讨论，尝试运用语文并结合其他学科知识解决问题。", "page": 11, "note": "【学段收束说明】在落实以上要求过程中，注重感悟国家通用语言文字的文化内涵……（印刷第11页）", "short": "能提出学习和生活中的问题，有目的地搜集资料，共同讨论，尝试解决问题"}]}}, "第三学段": {"grades": "5～6年级", "print_page": 11, "domains": {"识字与写字": [{"no": 1, "text": "有较强的独立识字能力。累计认识常用汉字3000个左右，其中2500个左右会写。感受汉字的构字组词特点，体会汉字蕴含的智慧。", "page": 11, "short": "有较强的独立识字能力"}, {"no": 2, "text": "写字姿势正确，有良好的书写习惯。硬笔书写楷书，行款整齐，力求美观，有一定的速度。能用毛笔书写楷书，在书写中体会汉字的优美。", "page": 11, "short": "写字姿势正确，有良好的书写习惯"}], "阅读与鉴赏": [{"no": 1, "text": "熟练地用普通话正确、流利、有感情地朗读课文。默读有一定的速度，默读一般读物每分钟不少于300字。学习浏览，扩大知识面，根据需要搜集信息。", "page": 12, "short": "熟练朗读，默读有一定速度，学习浏览，扩大知识面，根据需要搜集信息"}, {"no": 2, "text": "能联系上下文和自己的积累，推想课文中有关词句的意思，辨别词语的感情色彩，体会其表达效果。在理解课文的过程中体会顿号与逗号、分号与句号的不同用法。", "page": 12, "short": "推想词句意思，辨别感情色彩，体会表达效果"}, {"no": 3, "text": "在阅读中了解文章的表达顺序，体会作者的思想感情，初步领悟文章的基本表达方法。在交流和讨论中，敢于提出看法，作出自己的判断。", "page": 12, "short": "了解文章表达顺序，体会作者思想感情，领悟基本表达方法"}, {"no": 4, "text": "阅读叙事性作品，了解事件梗概，能简单描述印象最深的场景、人物、细节，说出自己的喜爱、憎恶、崇敬、向往、同情等感受；阅读诗歌，大体把握诗意，想象诗歌描述的情境，体会作品的情感。受到优秀作品的感染和激励，向往和追求美好的理想。", "page": 12, "short": "阅读叙事性作品了解梗概，简单描述场景人物细节，体会作品情感"}, {"no": 5, "text": "阅读说明性文章，能抓住要点，了解文章的基本说明方法。阅读简单的非连续性文本，能从图文等组合材料中找出有价值的信息。尝试使用多种媒介阅读。", "page": 12, "short": "阅读说明性文章，抓住要点，了解基本的说明方法"}, {"no": 6, "text": "阅读整本书，把握文本的主要内容，积极向同学推荐并说明理由。", "page": 12, "short": "阅读整本书，把握文本的主要内容，积极向同学推荐并说明理由"}, {"no": 7, "text": "背诵优秀诗文60篇(段),注意通过语调、韵律、节奏等体味作品的内容和情感。扩展阅读面，课外阅读总量不少于100万字。", "page": 12, "short": "背诵优秀诗文60篇(段),注意通过语调、韵律、节奏等体味作品的内容和情感"}], "表达与交流": [{"no": 1, "text": "听人说话认真、耐心，能抓住要点，并能简要转述。乐于表达，与人交流能尊重和理解对方。注意语言美，抵制不文明的语言。", "page": 12, "short": "听人说话认真、耐心，能抓住要点，并能简要转述"}, {"no": 2, "text": "表达有条理，语气、语调适当。参与讨论，敢于发表自己的意见，说清自己的观点。能根据对象和场合，稍作准备，作简单的发言。", "page": 12, "short": "表达有条理，语气、语调适当"}, {"no": 3, "text": "懂得写作是为了自我表达和与人交流。养成留心观察周围事物的习惯，有意识地丰富自己的见闻，珍视个人的独特感受，积累习作素材。", "page": 13, "short": "懂得写作是为了自我表达和与人交流"}, {"no": 4, "text": "能写简单的记实作文和想象作文，内容具体，感情真实。能根据内容表达的需要，分段表述。学写读书笔记，学写常见应用文。", "page": 13, "short": "写简单的记实作文和想象作文，内容具体、感情真实；根据需要分段表述"}, {"no": 5, "text": "修改自己的习作，并主动与他人交换修改，做到语句通顺，行款正确，书写规范、整洁。根据表达需要，正确使用常用的标点符号。习作要有一定速度。课内习作每学年16次左右。", "page": 13, "short": "修改习作并主动交换修改，语句通顺，行款正确，书写规范整洁"}], "梳理与探究": [{"no": 1, "text": "分类整理学过的字词，发现所学汉字形、音、义和书写的特点，发展独立识字能力和写字能力。", "page": 13, "short": "分类整理学过的字词，发现所学汉字形、音、义和书写的特点，发展独立识字能力和写字能力"}, {"no": 2, "text": "感受不同媒介的表达效果，学习跨媒介阅读与运用，初步运用多种方法整理和呈现信息。", "page": 13, "short": "感受不同媒介表达效果，跨媒介阅读，初步运用多种方法整理和呈现信息"}, {"no": 3, "text": "初步了解查找资料、运用资料的基本方法。利用图书馆、网络等渠道获取资料，解决与学习和生活相关的问题。尝试写简单的研究报告。", "page": 13, "short": "初步了解查找资料、运用资料的基本方法，解决相关问题，尝试写简单研究报告"}, {"no": 4, "text": "策划简单的校园活动和社会活动，对所策划的主题进行讨论和分析，学写活动计划和活动总结。对自己身边的、大家共同关注的问题，或影视作品中的故事和形象，通过调查访问、讨论演讲等方式，开展专题探究活动，学习辨别是非、善恶、美丑。", "page": 13, "short": "策划简单的校园活动和社会活动，学写活动计划和活动总结", "note": "【学段收束说明】在落实以上要求过程中，注重了解中华优秀传统文化的源远流长、丰富多彩，提升自身中华优秀传统文化修养；感受先贤志士的人格魅力，感悟老一辈无产阶级革命家的英雄气概、优良作风和高尚品质，体会捍卫民族尊严、维护国家利益和世界和平的伟大精神；初步形成对社会主义先进文化的认识。（印刷第13页）"}]}}}, "crossDomainLinks": {"五上-四-1": [["第三学段", "阅读与鉴赏", 3]], "六上-八-1": [["第三学段", "阅读与鉴赏", 3], ["第三学段", "阅读与鉴赏", 1]], "六下-四-2": [["第三学段", "阅读与鉴赏", 3]], "五下-五-2": [["第三学段", "表达与交流", 4]]}, "elementEvidenceMap": {"六上-八-1": {"资料运用": {"directTargets": [{"xd": "第三学段", "dom": "阅读与鉴赏", "no": 3, "reason": "【主要依据】在阅读中了解表达顺序、体会思想感情、理解主要内容"}, {"xd": "第三学段", "dom": "阅读与鉴赏", "no": 1, "reason": "【支持依据】学习浏览，根据需要搜集信息、扩大知识面"}, {"xd": "第三学段", "dom": "梳理与探究", "no": 3, "reason": "【方法依据】初步了解查找资料、运用资料的基本方法"}], "directQualities": [{"xueduan": "第三学段", "chapter": "五、学业质量 → (二)学业质量描述 → 第三学段", "printPage": "41", "pdfPage": "44", "text": "能借助与文本相关的材料，结合作品关键语句评价文本中的主要事件和人物，提出自己的观点或看法；能发现不同类型文本的结构方式和语言特点，感受作品内容、表现形式上的不同，积极向他人推荐，并有条理地说明推荐理由。", "short": "借助与文本相关的材料，结合关键语句评价主要事件和人物", "scope": "文学阅读·借助材料评价"}], "otherQualities": [{"xueduan": "第三学段" const U = D.units, L = D.lines, LINKS = D.links;

/* ---------- 通用工具 ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function el(eid){
  const uid = eid.slice(0, eid.lastIndexOf("-"));
  const u = U[uid]; if(!u) return null;
  const e = u.elements.find(x=>x.eid===eid);
  return e ? {u, e, uid} : null;
}
const VOL_LIST = ["一上","一下","二上","二下","三上","三下","四上","四下","五上","五下","六上","六下"];
const CN_NUMS = "一二三四五六七八九十";
function volOrder(v){return VOL_LIST.indexOf(v);}

function nodeOrderKey(eid){
  const parts = eid.split("-");
  const v = parts[0], u = parts[1], seq = parseInt(parts[2]||"1", 10);
  return volOrder(v) * 1000 + (CN_NUMS.indexOf(u)+1) * 10 + seq;
}

function getSourceInfo(u, e){
  if(u.xueduan === 1){
    return {
      type: "教参单元说明",
      badge: "教参单元说明（页码待补）",
      desc: "课本不设导语页（起始第 "+u.page+" 页）；要素取自教师教学用书「单元说明」（教参页码待补）",
      bookPageText: "课本起始第 "+u.page+" 页（不设导语页）"
    };
  } else {
    return {
      type: "教材导语原文",
      badge: "教材导语原文",
      desc: "课本第 "+u.page+" 页导语页原文",
      bookPageText: "课本第 "+u.page+" 页导语页"
    };
  }
}

/* ---------- 第一层：全表 ---------- */
let filterVol = "全部", scrollY = 0, curEid = null, curPath = 0;

function renderTools(){
  const vols = ["全部"].concat(Object.keys(D.versions).sort((a,b)=>volOrder(a)-volOrder(b)));
  let h = '<span style="font-size:12px;color:var(--muted)">按册定位</span>';
  for(const v of vols){
    h += '<button class="btn" data-vol="'+v+'" aria-pressed="'+(v===filterVol)+'">'+v+'</button>';
  }
  h += '<span class="spacer"></span>';
  h += '<button class="btn" id="expandAll">展开全部单元</button>';
  document.getElementById("tools").innerHTML = h;
  document.querySelectorAll("[data-vol]").forEach(b=>b.addEventListener("click",()=>{
    filterVol = b.dataset.vol; renderTools(); renderTable();
  }));
  document.getElementById("expandAll").addEventListener("click",()=>{
    document.getElementById("table").scrollIntoView({behavior:"smooth",block:"start"});
  });
}

function renderTable(){
  const vols = Object.keys(D.versions).sort((a,b)=>volOrder(a)-volOrder(b));
  let h = "";
  for(const v of vols){
    if(filterVol !== "全部" && filterVol !== v) continue;
    const vs = D.versions[v];
    const us = Object.values(U).filter(u=>u.vol===v).sort((a,b)=>"一二三四五六七八".indexOf(a.unit)-"一二三四五六七八".indexOf(b.unit));
    const isOk = vs.state && vs.state.includes("已核");
    h += '<div class="volhead"><b>'+esc(vs.name0||v)+'</b><span>'+us.length+' 个单元</span>'+
         '<span class="tagv '+(isOk?"ok":"todo")+'">'+esc(vs.state)+'</span>'+
         '<span>'+esc(vs.detail)+'</span></div><div class="units">';
    for(const u of us){
      let n = 0;
      let els = "";
      for(const e of u.elements){
        const lk = LINKS[e.eid] || [];
        if(lk.length) n++;
        const badge = lk.length
          ? lk.map(x=>x.line).join(" · ")
          : "该要素的关联尚未整理";
        els += '<button class="el'+(lk.length?" linked":"")+'" data-eid="'+e.eid+'">'+
               '<span class="no">'+e.seq+'</span>'+esc(e.text)+
               '<span class="badge'+(lk.length?"":" todo")+'">'+esc(badge)+'</span></button>';
      }
      const uTheme = u.theme || u['人文主题'];
      const srcInfo = getSourceInfo(u);
      h += '<div class="unit"><h4>第'+u.unit+'单元 <span>'+esc(srcInfo.bookPageText)+'</span>'+
           (n?'<span class="badge" style="background:#eef4f1;color:#2f5d50;border:1px solid #bcd3ca">已整理 '+n+'/'+u.elements.length+'</span>':'')+
           '</h4>'+
           (uTheme ? '<div class="theme">🌿 人文主题：'+esc(uTheme)+'</div>' : '')+
           els+'</div>';
    }
    h += '</div>';
  }
  document.getElementById("table").innerHTML = h;
  document.querySelectorAll("[data-eid]").forEach(b=>b.addEventListener("click",()=>openElement(b.dataset.eid)));
}

/* ---------- 第二层：脉络图 ---------- */
function openElement(eid){
  scrollY = window.scrollY;
  curEid = eid; curPath = 0;
  document.getElementById("table").style.display = "none";
  document.getElementById("detail").style.display = "block";
  renderDetail();
  window.scrollTo(0,0);
}
function closeDetail(){
  document.getElementById("detail").style.display = "none";
  document.getElementById("table").style.display = "block";
  window.scrollTo(0, scrollY);
}

function kbCard(xd, dom, no){
  const items = (D.kbiao[xd] && D.kbiao[xd].domains[dom]) || [];
  return items.find(x=>x.no===no) || null;
}

/* ---------- 统一的依据选择逻辑（页面渲染与导出完全共用） ---------- */
function getElementEvidences(eid, lk){
  const g = el(eid);
  if(!g || !lk) return { directTargets: [], otherTargets: [], directQualities: [], otherQualities: [] };
  const { u, e } = g;
  const lineName = lk.line;
  const L2 = L[lineName];
  const curXdName = ["", "第一学段", "第二学段", "第三学段"][u.xueduan] || "第三学段";

  const directTargets = [];
  const otherTargets = [];
  const seenKb = {};

  // 1. 检查 elementEvidenceMap 中是否有专门为该要素配置的目标
  const elemMap = (D.elementEvidenceMap && D.elementEvidenceMap[eid] && D.elementEvidenceMap[eid][lineName]) || null;

  if(elemMap && elemMap.directTargets && elemMap.directTargets.length > 0){
    for(const dt of elemMap.directTargets){
      const k = dt.xd + dt.dom + dt.no;
      if(seenKb[k]) continue;
      seenKb[k] = 1;
      const it = kbCard(dt.xd, dt.dom, dt.no);
      if(it){
        directTargets.push({
          xd: dt.xd,
          dom: dt.dom,
          no: dt.no,
          it: it,
          desc: dt.reason || lk.line,
          reason: dt.reason || lk.line,
          isDirect: true
        });
      }
    }
  } else {
    // 默认从脉络中按当前学段划分：只有属于当前学段的条目才加入 directTargets，并登记去重
    for(const [xd, dom, no] of (L2.kbiao || [])){
      if(xd === curXdName){
        const k = xd + dom + no;
        if(seenKb[k]) continue;
        seenKb[k] = 1;
        const it = kbCard(xd, dom, no);
        if(!it) continue;
        directTargets.push({
          xd: xd,
          dom: dom,
          no: no,
          it: it,
          desc: "【本学段直接目标】" + lk.line,
          reason: "【本学段直接目标】" + lk.line,
          isDirect: true
        });
      }
    }
  }

  // 收集本脉络关联的其他相关目标（未列为直接依据的目标，包括前后学段或同学段其他目标）
  for(const [xd, dom, no] of (L2.kbiao || [])){
    const k = xd + dom + no;
    if(seenKb[k]) continue;
    seenKb[k] = 1;
    const it = kbCard(xd, dom, no);
    if(!it) continue;
    otherTargets.push({
      xd: xd,
      dom: dom,
      no: no,
      it: it,
      desc: "【其他相关目标】" + lk.line,
      reason: "【其他相关目标】" + lk.line,
      isDirect: false
    });
  }

  // 2. 学业质量逻辑
  let directQualities = [];
  let otherQualities = [];

  if(curXdName !== "第三学段"){
    // 第一、第二学段：不借第三学段作为直接参照，所有 L2.quality 作为后续终结性拓展
    directQualities = [];
    otherQualities = (L2.quality || []).slice();
  } else {
    // 第三学段
    if(elemMap && elemMap.directQualities){
      directQualities = (elemMap.directQualities || []).slice();
      otherQualities = (elemMap.otherQualities || []).slice();
    } else {
      // 非专门配置的第三学段要素
      if(lineName === "资料运用"){
        // 资料运用中未专门配置的，不胡乱兜底，标尚未建立对应
        directQualities = [];
        otherQualities = [];
      } else {
        // 其他脉络（词句理解与品味、内容与信息把握、表达组织、形象与情感理解）
        directQualities = (L2.quality || []).slice();
        otherQualities = [];
      }
    }
  }

  return { directTargets, otherTargets, directQualities, otherQualities };
}

function sideNodes(list, kind){
  if(!list.length) return '<div class="empty">本侧暂无可列节点。</div>';
  let keys = list.filter(n=>n.key);
  if(!keys.length) keys = (kind === "pre") ? list.slice(-2) : list.slice(0,2);
  else keys = (kind === "pre") ? keys.slice(-2) : keys.slice(0,2);
  const showSet = new Set(keys.map(n=>n.eid));
  let h = "";
  list.forEach((n,i)=>{
    const g2 = el(n.eid); if(!g2) return;
    const u2 = g2.u;
    const vs2 = D.versions[u2.vol] || {};
    const src2 = getSourceInfo(u2, g2.e);
    const hidden = !showSet.has(n.eid);
    const lk0 = (D.links[n.eid]||[])[0];
    h += '<div class="node" data-node '+(hidden?'data-hidden style="display:none"':'')+'>'+
         '<div class="nh"><b>'+esc(vs2.name0||u2.vol)+' 第'+u2.unit+'单元</b><span>'+esc(src2.bookPageText)+'</span>'+
         (n.key?'<span class="lbl2" style="background:#eef4f1;color:#2f5d50;border-color:#bcd3ca">代表性</span>':'')+
         '</div>'+
         '<div class="sum"><i>概括</i>'+esc(n.link)+'</div>'+
         '<div class="full">'+
         '<div class="row"><span class="lbl src">'+esc(src2.badge)+'</span>'+esc(g2.e.text)+'</div>'+
         '<div class="row"><span class="k">来源说明：'+esc(src2.desc)+'　要素编号 '+esc(n.eid)+'</span></div>'+
         '<div class="row"><span class="lbl jd">关联说明</span>'+esc(n.link)+'</div>'+
         (n.verified
            ? '<div class="row"><span class="lbl2 src">已回教材原页核对</span></div>'
            : '<div class="row"><span class="lbl2 todo">沿用早前逐页提取结果</span></div>')+
         (lk0 && lk0.line !== curLineName()
            ? '<div class="row"><span class="k">该要素还关联：'+esc(lk0.line)+'</span></div>' : '')+
         '</div></div>';
  });
  const nHidden = list.length - showSet.size;
  if(nHidden > 0){
    h += '<button class="more" data-more>展开其余相关节点（还有 '+nHidden+' 个）</button>';
  }
  return h;
}

function curLineName(){
  const g = el(curEid); if(!g) return "";
  const lks = LINKS[curEid]||[];
  return lks.length ? lks[curPath % lks.length].line : "";
}

  const o = [
    "# 单元要素脉络 · "+(vs.name0||u.vol)+" 第"+u.unit+"单元", "",

    "- **所属册别与单元**："+(vs.name0||u.vol)+" 第"+u.unit+"单元",
    "- **教材版本定性**："+versionDesc,

    "- **取向标注**："+e.orient+"（"+e.orientNote+"）",
    "- **所属学段**："+curXdName,
    (uTheme ? "- **单元人文主题**："+uTheme : "- **单元人文主题**：教参未设明确主题"),
    "",
    "## 当前要素（教材/教参原文）", "",
    "> " + e.text, ""
  ];

  if(!links.length){
    o.push("## 关联状态", "", "该要素的关联尚未整理。此处只呈现原文与来源，不呈现前后脉络。", "");
  } else {
    for(const lk of links){
      const L2 = L[lk.line], arr = L2.nodes;
      const curNode = arr.find(n => n.eid === curEid);
      const curOrder = nodeOrderKey(curEid);
      const pre = [], post = [], sameUnit = [];
      for(const n of arr){
        if(n.eid === curEid) continue;
        const nOrder = nodeOrderKey(n.eid);
        const nUid = n.eid.slice(0, n.eid.lastIndexOf("-"));
        if(nUid === g.uid){ sameUnit.push(n); }
        else if(nOrder < curOrder){ pre.push(n); }
        else { post.push(n); }
      }

      o.push("## 关联路径："+lk.line, "",
             "- **当前要素关联说明**："+((curNode && curNode.link) || lk.link || "当前单元明确要求：" + e.text),
             "- 本要素是这条脉络第 "+(lk.index+1)+"/"+lk.total+" 个节点。",
             "- 该路径已整理范围："+lk.total+" 个节点（局部试验脉络，非完整教材链条）。", "");

      const dump = (title, list) => {
        o.push("### "+title, "");
        if(!list.length){ o.push("（本侧暂无可列节点）",""); return; }
        for(const n of list){
          const g2 = el(n.eid); if(!g2) continue;
          const v2 = D.versions[g2.u.vol]||{};
          const s2 = getSourceInfo(g2.u, g2.e);
          let v2State = v2.state ? (v2.state.includes("统编旧版") ? "统编旧版（经用户核定）" : v2.state) : "版本待核";
          o.push("- **"+(v2.name0||g2.u.vol)+" 第"+g2.u.unit+"单元**（"+s2.bookPageText+"）"+(n.key?"　［代表性节点］":""),
                 "  - 原文："+g2.e.text,
                 "  - 来源："+s2.badge,
                 "  - 版本定性："+v2State,
                 "  - 关联说明（教研判断）："+n.link,
                 "  - 核验状态："+(n.verified ? "已回原件核对" : "沿用早前提取结果"));
        }
        o.push("");
      };

      dump("此前相关教材要素（按教材先后排列）", pre);
      if(sameUnit.length > 0){
        o.push("### 同单元相关要素（非前后阶梯）", "");
        for(const n of sameUnit){
          const g2 = el(n.eid); if(!g2) continue;
          o.push("- **同单元要素** `"+n.eid+"`："+g2.e.text+"（"+n.link+"）");
        }
        o.push("");
      }
      dump("此后相关教材要素（按教材先后排列）", post);
    }

    o.push("## 课标依据（学段目标）", "");
    for(const lk of links){
      o.push("### 关联路径："+lk.line+" · 学段目标依据", "");
      const ev = getElementEvidences(curEid, lk);
      if(ev.directTargets.length > 0){
        o.push("#### 直接相关依据（"+curXdName+"）", "");
        for(const t of ev.directTargets){
          o.push("- **"+t.xd+"　"+t.dom+" 第"+t.no+"条**（印刷第 "+t.it.page+" 页／PDF第 "+(t.it.page+3)+" 页）",
                 "  - **关联性质**："+t.reason,
                 "  - **课标原文**："+t.it.text,
                 (t.it.note ? "  - **附注**："+t.it.note : ""),
                 "");
        }
      }
      if(ev.otherTargets.length > 0){
        o.push("#### 其他相关目标参照", "");
        for(const t of ev.otherTargets){
          o.push("- **"+t.xd+"　"+t.dom+" 第"+t.no+"条**（印刷第 "+t.it.page+" 页／PDF第 "+(t.it.page+3)+" 页）",
                 "  - **关联性质**："+t.reason,
                 "  - **课标原文**："+t.it.text,
                 (t.it.note ? "  - **附注**："+t.it.note : ""),
                 "");
        }
      }
    }

    o.push("## 学业质量参照（学段结束时的综合表现参照）", "");
    if(curXdName !== "第三学段"){
      o.push("> **说明**：当前要素所属"+curXdName+"的学业质量对应尚未单独整理。按规范不借用第三学段条文填充。", "");
      o.push("### 后续学段（第三学段）终结表现参照", "");
      for(const lk of links){
        const ev = getElementEvidences(curEid, lk);
        for(const q of ev.otherQualities){
          o.push("- **"+q.xueduan+" · 学业质量描述**（印刷第 "+q.printPage+" 页／PDF第 "+q.pdfPage+" 页）",
                 "  - **课标原文**："+q.text,
                 "  - **所属章节**："+q.chapter,
                 "  - **要点**："+q.short,
                 "  - **说明**：学段结束时的综合表现参照，不等同于当前单元达成要求。", "");
        }
      }
    } else {
      for(const lk of links){
        o.push("### 关联路径："+lk.line+" · 学业质量表现参照", "");
        const ev = getElementEvidences(curEid, lk);
        if(!ev.directQualities.length){
          o.push("（当前要素学业质量对应尚未单独建立，不自动填充不相关条款）", "");
        } else {
          o.push("#### 直接表现参照", "");
          for(const q of ev.directQualities){
            o.push("- **"+q.xueduan+" · 学业质量描述**（印刷第 "+q.printPage+" 页／PDF第 "+q.pdfPage+" 页）",
                   "  - **课标原文**："+q.text,
                   "  - **所属章节**："+q.chapter,
                   "  - **要点**："+q.short,
                   "  - **性质**：学段结束时的综合表现参照，不等同于本单元达标要求。", "");
          }
        }
        if(ev.otherQualities.length > 0){
          o.push("#### 综合拓展表现参照", "");
          for(const q of ev.otherQualities){
            o.push("- **"+q.xueduan+" · 学业质量描述**（印刷第 "+q.printPage+" 页／PDF第 "+q.pdfPage+" 页）",
                   "  - **课标原文**："+q.text,
                   "  - **所属章节**："+q.chapter,
                   "  - **要点**："+q.short,
                   "");
          }
        }
      }
    }
  }

  o.push("---","",
    "## 查阅说明与版本附注",
    "> 1. **课标依据来源**：《义务教育语文课程标准（2022年版）》（注：参考日常修订可搜索版，印刷页码=PDF页码-3）。",
    "> 2. **教材版本依据**：三至六年级按教育部统编语文教材导语页，一二年级按教师教学用书「单元说明」。四下、五下、六下经核定确认为统编教材旧版，其余册别按各自登记信息呈现，未替用户作未核定确认。",
    "> 3. **关联性质说明**：课标原文、教材原文、关联解释已分别标注。关联解释是教研判断，不是官方逐项对应表。",
    "> 4. **排列顺序说明**：排列顺序说明教材编排次序，不表示能力发展的先后阶梯。");

  const blob = new Blob([o.join(String.fromCharCode(10))], {type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "要素脉络_"+curEid+".md";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

/* ---------- 启动 ---------- */
for(const k in D.versions){ D.versions[k].name0 = FULL[k]; }
document.getElementById("sub").innerHTML =
  "点击任意一条单元要素，查看它的课标依据与此前／此后相关要素。<br>" +
  "全表 94 个单元；已整理关联的要素标出脉络名，未整理的标「该要素的关联尚未整理」，不推测关联。";
document.getElementById("foot").innerHTML =
  esc(D.meta.kbiaoNote) + "<br>" + esc(D.meta.qualityNote) + "<br>" +
  esc(D.meta.verifyNote) + "<br>" + esc(D.meta.scopeNote);
renderTools(); renderTable();
</script>
</body>
</html>
